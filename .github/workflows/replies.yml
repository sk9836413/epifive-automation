# Comment replies. Code, prompts and notes live in the private repo (ops/; annotated copy: ops/docs/workflow-notes/replies.yml).
name: Comment replies

on:
  workflow_run:
    workflows: [Launch radar, Social media, Long video, Photo posts, Daily article]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read and decide, but post nothing and save no state
        type: boolean
        default: false
      platforms:
        description: Platforms (comma-separated; empty = the COMMENT_REPLY_PLATFORMS variable or all three)
        type: string
        default: ''
      max:
        description: Most replies in this run
        type: string
        default: '8'
      resume:
        description: Clear a pause after fixing its cause (youtube, facebook, instagram, dm or all)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: comment-replies
  cancel-in-progress: false

jobs:
  reply:
    if: github.event_name == 'workflow_dispatch' || vars.COMMENT_REPLIES == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Due?
        id: gate
        run: |
          mkdir -p replies
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then exit 0; fi
          last=$(node -e "try { console.log(Date.parse(require('./replies/state.json').lastRun) || 0) } catch { console.log(0) }")
          if [ $(( $(date +%s%3N) - last )) -lt $(( 50 * 60 * 1000 )) ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::notice::Last run under 50 minutes ago; skipped."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site
          sparse-checkout: |
            content/posts
            scripts/social
            automation

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 24

      - name: Reply
        if: steps.gate.outputs.skip != 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_DM: ${{ vars.META_DM }}
          PLATFORMS: ${{ inputs.platforms || vars.COMMENT_REPLY_PLATFORMS || 'youtube,facebook,instagram' }}
          MAX: ${{ inputs.max || '8' }}
          RESUME: ${{ inputs.resume }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -- --state ../replies/state.json --log-dir ../replies/log --photos-log ../photos/log.md --extra-log ../reels/log.md --platforms "$PLATFORMS" --max "$MAX"
          [ -n "$RESUME" ] && set -- "$@" --resume "$RESUME"
          [ "$DRY" = "true" ] && set -- "$@" --dry-run
          cd site && node scripts/social/comment-replies.mjs "$@" | tee "$RUNNER_TEMP/result.json"
          { echo '```json'; cat "$RUNNER_TEMP/result.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save state and log
        if: steps.gate.outputs.skip != 'true' && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add replies
          git diff --cached --quiet && exit 0
          git commit -qm "Comment replies $(date -u '+%F %H:%M') UTC"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
