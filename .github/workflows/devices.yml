# Daily device specs: Claude adds popular devices to the /devices portal (content/devices/*.json)
# from the manufacturers' official spec pages, following automation/DEVICES.md.
# Started daily by the Cloudflare scheduler (43 4 UTC, 10:13 IST) with the default count of 3;
# skips when automation/devices-log.md already has today's date (unless force=true).
name: Device specs

on:
  workflow_dispatch:
    inputs:
      count:
        description: How many devices to add (1-25)
        default: '3'
      focus:
        description: Optional focus, e.g. "Samsung Galaxy A/M phones" or "laptops"
        default: ''
      force:
        description: Run even if today's devices were already added (backfill)
        type: boolean
        default: false

env:
  SITE_REMOTE: https://x-access-token:${{ secrets.SITE_REPO_TOKEN }}@github.com/sk9836413/EPIVIFE.git

permissions:
  contents: write
  id-token: write

concurrency:
  group: devices
  cancel-in-progress: false

jobs:
  devices:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}

      - name: Date
        id: date
        env:
          COUNT: ${{ inputs.count || '3' }}
          FORCE: ${{ inputs.force }}
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          case "$COUNT" in ''|*[!0-9]*) COUNT=3 ;; esac
          [ "$COUNT" -lt 1 ] && COUNT=1
          [ "$COUNT" -gt 25 ] && COUNT=25
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "turns=$((40 + COUNT * 15))" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != "true" ] && grep -q "^$today |" automation/devices-log.md 2>/dev/null; then
            echo "Devices already added today ($today); skipping."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.date.outputs.done != 'true'
        with:
          node-version: 24

      - name: Add devices (Claude)
        id: claude
        continue-on-error: true # keep the devices already written if Claude runs out of turns
        if: steps.date.outputs.done != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns ${{ steps.date.outputs.turns }}
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/check-devices.mjs:*),Bash(node scripts/seo/wikidata-device.mjs:*),Bash(node scripts/seo/build-vs-pairs.mjs:*),Bash(ls:*)"
          prompt: |
            Follow automation/DEVICES.md exactly. Today's date (IST) is ${{ steps.date.outputs.today }}.
            Add ${{ steps.date.outputs.count }} new device(s).
            Focus: ${{ inputs.focus || 'none (rotate categories as DEVICES.md says)' }}.
            Only create new content/devices/<slug>.json files, append to automation/devices-log.md and
            regenerate src/data/vs-pairs.json with node scripts/seo/build-vs-pairs.mjs.

      - name: Claude's report
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: jq -r '[.[] | select(.type == "result")] | last | .result // empty' "$EXEC_FILE" || true

      - name: Check devices
        if: steps.date.outputs.done != 'true'
        # build-vs-pairs is deterministic and offline: re-running it here keeps src/data/vs-pairs.json
        # (the X vs Y comparison pages) in step with the devices even if Claude skipped it.
        run: |
          node scripts/check-devices.mjs
          node scripts/seo/build-vs-pairs.mjs

      - name: Save
        id: save
        if: steps.date.outputs.done != 'true'
        run: |
          bad=$(git status --porcelain -uall | grep -vE '^( M|M |MM|\?\?|A ) (content/devices/[a-z0-9-]+\.json|automation/devices-log\.md|src/data/vs-pairs\.json)$' || true)
          [ -z "$bad" ] || { echo "::error::Unexpected changes: $bad"; exit 1; }
          git add content/devices automation/devices-log.md src/data/vs-pairs.json
          git diff --cached --quiet && { echo "No new devices."; exit 0; }
          slugs=$(git diff --cached --name-only --diff-filter=A -- content/devices | sed -E 's#content/devices/(.*)\.json#\1#' | tr '\n' ' ')
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          # X vs Y pages that involve a new device, for IndexNow after the deploy.
          vs=$(node -e 'const j=require("./src/data/vs-pairs.json");const s=new Set(process.argv.slice(1));for(const p of j.pairs)if(s.has(p.a)||s.has(p.b))console.log("https://www.epifive.com/devices/vs/"+p.a+"-vs-"+p.b)' $slugs | tr '\n' ' ')
          echo "vs=$vs" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Devices ${{ steps.date.outputs.today }}: add $(echo $slugs | sed 's/ /, /g')"
          pushed=""
          for i in 1 2 3; do git pull -q --rebase "$SITE_REMOTE" main && git push -q "$SITE_REMOTE" HEAD:main && { pushed=1; break; }; sleep 10; done
          [ -n "$pushed" ] || { echo "::error::Push failed"; exit 1; }
          git log -1 --format='Pushed %h %s'

      - name: Wait for the deploy and submit to IndexNow
        # A curl hiccup while waiting for Cloudflare (exit 35/56) must not mark the run failed: the
        # devices are already committed by then.
        continue-on-error: true
        if: steps.save.outputs.slugs != ''
        env:
          SLUGS: ${{ steps.save.outputs.slugs }}
          VS_URLS: ${{ steps.save.outputs.vs }}
        run: |
          urls=""
          for s in $SLUGS; do urls="$urls https://www.epifive.com/devices/$s"; done
          live=""
          for i in $(seq 1 40); do
            live=""; missing=""
            for u in $urls; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$u")
              [ "$code" = "200" ] && live="$live $u" || missing="$missing $u"
            done
            [ -z "$missing" ] && break
            sleep 30
          done
          [ -z "$missing" ] || echo "::warning::Not live after 20 minutes:$missing"
          echo "Live:$live"
          [ -z "$live" ] || node scripts/seo/indexnow.mjs $live $VS_URLS
