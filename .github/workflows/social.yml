# Social media. Code, prompts and notes live in the private repo (ops/; annotated copy: ops/docs/workflow-notes/social.yml).
name: Social media

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Only render a test card and video (no Claude, no posting)
        type: boolean
        default: false
      force:
        description: Share another article even if one was already shared today
        type: boolean
        default: false
      slug:
        description: Share this article instead of the next one in line (optional)
        type: string
        default: ''
      brief:
        description: Extra instruction for the writer, e.g. a free EpiFive tool to feature (optional)
        type: string
        default: ''
      format:
        description: '"dialogue" makes this share a Max & Riya character Short (empty = automatic, see CHAR_SHORTS)'
        type: string
        default: ''
      dry_run:
        description: Write and render everything, publish and log nothing (the media stay in the run's artifact)
        type: boolean
        default: false
      allow_news:
        description: Make the video even if the article is news (outage, CEO, retirement, incident, launch); off = skip it
        type: boolean
        default: false
      linkedin_via:
        description: 'LinkedIn Page poster for this run only: empty = repo variable LINKEDIN_VIA (default make), or pipedream / make'
        type: choice
        options: ['', pipedream, make]
        default: ''

env:
  SITE_REMOTE: https://x-access-token:${{ secrets.SITE_REPO_TOKEN }}@github.com/sk9836413/EPIVIFE.git
  COMMENT_FUNNEL_IG: ${{ vars.COMMENT_FUNNEL_IG }}
  META_DM: ${{ vars.META_DM }}
  REEL_STYLE: ${{ vars.REEL_STYLE }}
  REEL_AUDIO: ${{ vars.REEL_AUDIO }}
  REEL_BED: ${{ vars.REEL_BED }}
  REEL_VOICE_EN: ${{ vars.REEL_VOICE_EN }}
  REEL_VOICE_HI: ${{ vars.REEL_VOICE_HI }}
  IG_TRIAL_REELS: ${{ vars.IG_TRIAL_REELS }}

permissions:
  contents: write
  id-token: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends ffmpeg fonts-inter > /dev/null
          npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-onnx-model-files-v1.1
      - run: bash scripts/social/setup-tts.sh ~/kokoro
      - name: Render test card and video
        run: |
          slug=$(ls content/posts | head -1 | sed -E 's/\.mdx?$//')
          mkdir -p smoke
          cat > smoke/points.txt <<'EOF'
          First test point for the smoke render, long enough to wrap onto two lines.
          Second test point checks fonts, wrapping and the slide counter.
          Third test point.
          EOF
          node scripts/social/card.mjs "$slug" --out smoke/card.jpg
          node scripts/social/video.mjs "$slug" --points smoke/points.txt --out smoke/reel.mp4 --narrate
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,sample_rate -of compact smoke/reel.mp4
          ffmpeg -hide_banner -i smoke/reel.mp4 -af ebur128 -f null - 2>&1 | grep -E "^\s+I:" | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: smoke
          retention-days: 3

  share:
    if: github.event_name == 'schedule' || !inputs.smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - name: Check Claude token
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "ready=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then echo "::notice::CLAUDE_CODE_OAUTH_TOKEN secret is not set; skipping."; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}
          fetch-depth: 0 # the Make step prunes hosted media by the date it was committed

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install ffmpeg, fonts and dependencies
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends ffmpeg fonts-inter > /dev/null
          npm ci --no-audit --no-fund

      - name: Cache voice-over model
        if: steps.gate.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-onnx-model-files-v1.1

      - name: Install voice-over (Kokoro TTS)
        if: steps.gate.outputs.ready == 'true'
        run: bash scripts/social/setup-tts.sh ~/kokoro

      - name: Pick article
        id: pick
        if: steps.gate.outputs.ready == 'true'
        env:
          SLUG_INPUT: ${{ inputs.slug }}
        run: |
          today=$(date -u +%F)
          max=1
          count=$(grep -c "^- $today | " automation/social-log.md || true)
          owner_force=false
          if [ "${{ inputs.force }}" = "true" ] && [ "$GITHUB_ACTOR" != "github-actions[bot]" ]; then owner_force=true; fi
          if [ "$owner_force" != "true" ] && [ "$count" -ge "$max" ]; then
            echo "::notice::Already shared $count of $max articles on $today; nothing to do."
            echo "slug=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ inputs.force }}" != "true" ] && [ "$(date -u +%-H)" -lt "${{ vars.SHARE_FROM_UTC_HOUR || 0 }}" ]; then
            echo "::notice::Before ${{ vars.SHARE_FROM_UTC_HOUR }}:00 UTC; shares wait for the US-morning slots."
            echo "slug=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          slug="$SLUG_INPUT"
          if [ -n "$slug" ] && { ! [[ "$slug" =~ ^[a-z0-9-]+$ ]] || ! ls content/posts/"$slug".md* > /dev/null 2>&1; }; then echo "::error::No article $slug"; exit 1; fi
          if [ -n "$slug" ] && [ "$GITHUB_ACTOR" = "github-actions[bot]" ] && grep -q "^- [0-9-]* | $slug | " automation/social-log.md; then
            echo "::notice::$slug was already shared; the launch radar's trending share is skipped."
            echo "slug=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$slug" ] && [ "$count" -eq 0 ]; then
            node scripts/social/promo.mjs > "$RUNNER_TEMP/promo.json"
            slug=$(node -p "require('$RUNNER_TEMP/promo.json').slug || ''")
            if [ -n "$slug" ]; then
              node -e "const p=require('$RUNNER_TEMP/promo.json'); require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'brief<<EOF_BRIEF\n' + p.brief + '\nEOF_BRIEF\n')"
              echo "Promo share: $slug"
            fi
          fi
          if [ -n "$slug" ] && [ -z "$SLUG_INPUT" ] && [ "$(node scripts/social/video-kind.mjs "$slug" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).video')" != true ]; then
            echo "::notice::Promo article $slug is not a fix/how-to; the day's fix article goes out instead."
            slug=""
            echo "brief<<EOF_BRIEF" >> "$GITHUB_OUTPUT"; echo "EOF_BRIEF" >> "$GITHUB_OUTPUT"
          fi
          [ -n "$slug" ] || slug="$(node scripts/social/pick.mjs)"
          if [ -n "$slug" ]; then
            kind=$(node scripts/social/video-kind.mjs "$slug")
            echo "Video kind: $kind"
            if [ "$(node -p 'JSON.parse(process.argv[1]).video' "$kind")" != true ] && [ "${{ inputs.allow_news }}" != "true" ]; then
              echo "::notice::$slug is not a fix/how-to ($kind); no video (owner plan, 16 Nov 2026). Run with allow_news to override."
              echo "slug=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "hinglish=$([ "${{ vars.HINGLISH_REELS }}" = off ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          fmt=reel
          if [ "${{ inputs.format }}" = dialogue ] || { [ "${{ vars.CHAR_SHORTS }}" = on ] && [ "$count" -eq 1 ] && [ -z "$SLUG_INPUT" ]; }; then fmt=dialogue; fi
          echo "format=$fmt" >> "$GITHUB_OUTPUT"
          echo "dir=social-drafts/$(date -u +%F)-$slug" >> "$GITHUB_OUTPUT"
          if [ -z "$slug" ]; then echo "::notice::Nothing new to share."; else echo "Sharing $slug"; fi

      - name: Prompt for Write posts and render media (Claude)
        if: steps.pick.outputs.slug != ''
        env:
          SLUG: ${{steps.pick.outputs.slug}}
          DIR: ${{steps.pick.outputs.dir}}
          BRIEF: ${{ inputs.brief || steps.pick.outputs.brief }}
          DIALOGUE: ${{ steps.pick.outputs.format == 'dialogue' }}
          HINGLISH: ${{ steps.pick.outputs.hinglish == 'true' }}
        run: |
          if [ -d .git ]; then grep -qx '.ops-\*' .git/info/exclude || printf '.ops-*\n' >> .git/info/exclude; fi
          node ops/prompts/render.mjs ops/prompts/social-write-posts-and-render-media-claude.md .ops-prompt.md

      - name: Write posts and render media (Claude)
        if: steps.pick.outputs.slug != ''
        uses: anthropics/claude-code-action@v1
        env:
          BASH_DEFAULT_TIMEOUT_MS: '1200000'
          BASH_MAX_TIMEOUT_MS: '1500000'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "*"
          claude_args: |
            --max-turns 90
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(node scripts/social/card.mjs:*),Bash(node scripts/social/video.mjs:*),Bash(node scripts/social/validate.mjs:*),Bash(ffmpeg:*),Bash(mkdir:*),Bash(ls:*),Bash(rm ${{ steps.pick.outputs.dir }}/frame-*),Bash(rm ${{ steps.pick.outputs.dir }}/hi/frame-*)"
          prompt: Your task for this run is in the file .ops-prompt.md in the repository root. Read it first and follow it exactly.

      - name: Validate drafts
        if: steps.pick.outputs.slug != ''
        run: |
          rm -f "${{ steps.pick.outputs.dir }}"/frame-* "${{ steps.pick.outputs.dir }}"/hi/frame-*
          node scripts/social/validate.mjs "${{ steps.pick.outputs.slug }}" "${{ steps.pick.outputs.dir }}" --part en

      - name: Cache Whisper model
        if: steps.pick.outputs.slug != '' && steps.pick.outputs.hinglish == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small-v1

      - name: Hinglish version check
        id: hi
        if: steps.pick.outputs.slug != '' && steps.pick.outputs.hinglish == 'true'
        env:
          DIR: ${{ steps.pick.outputs.dir }}
          EN_SLOT_UTC: ${{ vars.EN_SLOT_UTC }}
        run: |
          ok=false
          if node scripts/social/validate.mjs "${{ steps.pick.outputs.slug }}" "$DIR" --part hi; then
            audio=$(node -p "try { JSON.parse(require('fs').readFileSync('$DIR/hi/reel-meta.json', 'utf8')).audio || 'voice' } catch { 'voice' }")
            if [ "$audio" = text ]; then
              echo "Silent-text Hinglish reel: no voice to check."
              ok=true
            else
              "$PYTHON" -m pip install -q faster-whisper > /dev/null 2>&1 || echo "::warning::faster-whisper install failed"
              if "$PYTHON" scripts/social/hinglish-check.py --audio "$DIR/hi/reel.mp4" --narration "$DIR/hi/narration.txt" > "$DIR/hi/voice-check.json"; then ok=true; fi
              cat "$DIR/hi/voice-check.json"
            fi
          fi
          if [ "$ok" = true ]; then
            en_at=$(node scripts/social/slots.mjs english)
            echo "en_at=$en_at" >> "$GITHUB_OUTPUT"
            echo "- Hinglish version: ok, published now; English version at $en_at" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The Hinglish version did not pass its checks; this share goes out in English only."
            echo "- Hinglish version: failed its checks (English only, at once)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Character engine (public repo shyam-premi-sn)
        if: steps.pick.outputs.slug != '' && steps.pick.outputs.format == 'dialogue'
        uses: actions/checkout@v4
        with:
          repository: sk9836413/shyam-premi-sn
          path: .charkit

      - name: Character Short (Max & Riya)
        id: char
        if: steps.pick.outputs.slug != '' && steps.pick.outputs.format == 'dialogue'
        continue-on-error: true
        timeout-minutes: 80
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SPS_SLOT: char-epifive
          DIR: ${{ steps.pick.outputs.dir }}
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends fonts-dejavu-core > /dev/null || true
          export PATH="$(dirname "$PYTHON"):$PATH"
          pip install -q pillow
          K=.charkit; w="$RUNNER_TEMP/char"; mkdir -p "$w"
          c="python -I $K/characters/dialogue.py"
          $c voice --spec "$DIR/dialogue.json" --channel epifive --out "$w/voice"
          $c plan --spec "$DIR/dialogue.json" --channel epifive --voice "$w/voice" --out "$w/plan.json"
          lipsync() {
            [ -n "$KAGGLE_API_TOKEN" ] || { echo "no KAGGLE_API_TOKEN secret (owner step)"; return 1; }
            pip install -q 'kaggle>=2.2' six || return 1
            (cd $K && node animate/kaggle.mjs quota --min 2) || { echo "under 2 Kaggle GPU hours left"; return 1; }
            $c dataset --plan "$w/plan.json" --voice "$w/voice" --out "$K/animate/dataset" --max-minutes 30 || return 1
            (cd $K && node animate/kaggle.mjs upload && node animate/kaggle.mjs lock --minutes 30 \
              && node animate/kaggle.mjs push --queue-minutes 20 --retry-minutes 15) || { echo "Kaggle busy or push failed"; return 1; }
            (cd $K && node animate/kaggle.mjs wait --minutes 40 --queue-minutes 20) > "$w/wait.json" || echo "Kaggle: $(cat "$w/wait.json")"
            grep -q QUEUED_TOO_LONG "$w/wait.json" && { echo "queued over 20 min"; return 1; }
            (cd $K && node animate/kaggle.mjs fetch --to "$w/lipsync")
          }
          lipsync > "$w/lipsync.log" 2>&1 || echo "::warning::Lip-sync skipped, still images: $(tail -1 "$w/lipsync.log")"
          $c render --spec "$DIR/dialogue.json" --channel epifive --plan "$w/plan.json" --voice "$w/voice" --lipsync "$w/lipsync" \
            --visuals "$DIR/visuals.json" --out "$DIR/dialogue.mp4" --srt "$DIR/dialogue.srt" --meta "$DIR/dialogue-meta.json"
          echo "- Max & Riya: $(tail -1 "$w/lipsync.log" | head -c 200) | $(head -c 300 "$DIR/dialogue-meta.json" | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

      - name: Pick the videos
        id: media
        if: steps.pick.outputs.slug != ''
        env:
          DIR: ${{ steps.pick.outputs.dir }}
        run: |
          # One version per platform (owner, 24 Nov 2026; video.mjs): reel.mp4 = YouTube (subscribe/like/comment GUIDE),
          # reel-ig.mp4 = Instagram (follow/save/send/comment GUIDE for the guide in DM), reel-fb.mp4 = Facebook (follow +
          # guide link in the caption, no like/comment ask; also the Make fallback). Older drafts without them use reel.mp4.
          pick() { if [ -s "$1" ]; then echo "$1"; else echo "$2"; fi; }
          yt="$DIR/reel.mp4"; cap="$DIR/captions.srt"
          fb=$(pick "$DIR/reel-fb.mp4" "$DIR/reel.mp4"); ig=$(pick "$DIR/reel-ig.mp4" "$fb")
          hi_fb=$(pick "$DIR/hi/reel-fb.mp4" "$DIR/hi/reel.mp4"); hi_ig=$(pick "$DIR/hi/reel-ig.mp4" "$hi_fb")
          if [ "${{ steps.char.outcome }}" = success ] && [ -s "$DIR/dialogue.mp4" ]; then
            # The character Short ends with the YouTube ask (like and subscribe), so it goes to YouTube only;
            # Facebook and Instagram get their own reel versions.
            yt="$DIR/dialogue.mp4"; cap="$DIR/dialogue.srt"
          fi
          { echo "youtube=$yt"; echo "captions=$cap"; echo "social=$fb"; echo "fb=$fb"; echo "ig=$ig"; echo "hi_fb=$hi_fb"; echo "hi_ig=$hi_ig"; } >> "$GITHUB_OUTPUT"
          for f in "$DIR/reel.mp4" "$DIR/hi/reel.mp4" "$fb" "$ig" "$hi_fb" "$hi_ig"; do
            if [ -s "$f" ]; then node scripts/social/reel-spec.mjs "$f" --fix || echo "::warning::$f does not meet Meta's Reels spec (see the line above)"; fi
          done

      - name: Publish to Facebook and Instagram (Graph API)
        id: meta
        if: steps.pick.outputs.slug != ''
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          REELS_HOST_REPO: ${{ github.repository }}
          REELS_HOST_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.pick.outputs.slug }}
          DIR: ${{ steps.pick.outputs.dir }}
          VIDEO: ${{ steps.media.outputs.fb }}
          IG_VIDEO: ${{ steps.media.outputs.ig }}
          HI_VIDEO: ${{ steps.media.outputs.hi_fb }}
          HI_IG_VIDEO: ${{ steps.media.outputs.hi_ig }}
          DRY_RUN: ${{ inputs.dry_run }}
          HI: ${{ steps.hi.outputs.ok == 'true' }}
          EN_AT: ${{ steps.hi.outputs.en_at }}
        run: |
          echo "direct=false" >> "$GITHUB_OUTPUT"
          if [ -z "$META_PAGE_TOKEN" ] || [ -z "$META_PAGE_ID" ]; then
            echo "::notice::META_* secrets not set; Facebook and Instagram go through Make."
            exit 0
          fi
          if [ "$HI" = true ]; then
            set -- --slug "$SLUG" --video "$HI_VIDEO" --ig-video "$HI_IG_VIDEO" --fb-reel "$DIR/hi/fb-reel.txt" --ig "$DIR/hi/instagram.txt" --lang hi
          else
            set -- --slug "$SLUG" --video "$VIDEO" --ig-video "$IG_VIDEO" --fb-reel "$DIR/fb-reel.txt" --ig "$DIR/instagram.txt"
          fi
          en=(--slug "$SLUG" --video "$VIDEO" --fb-reel "$DIR/fb-reel.txt" --only fb-reel --publish-at "$EN_AT")
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/social/meta-post.mjs "$@" --dry-run || true
            [ "$HI" = true ] && { node scripts/social/meta-post.mjs "${en[@]}" --dry-run || true; }
            exit 0
          fi
          result="$RUNNER_TEMP/meta-result.json"
          node scripts/social/meta-post.mjs "$@" > "$result" || echo "::warning::Some Facebook/Instagram posts failed; see the result line."
          cat "$result"
          status=$(node -p "try { const r = JSON.parse(require('fs').readFileSync('$result', 'utf8').trim().split('\n').pop()); r.authFailed ? 'auth' : r.status } catch { 'error' }")
          if [ "$status" = ok ] || [ "$status" = partial-failure ]; then
            echo "direct=true" >> "$GITHUB_OUTPUT"
            echo "result=$result" >> "$GITHUB_OUTPUT"
            if [ "$HI" = true ]; then
              en_result="$RUNNER_TEMP/meta-en-result.json"
              node scripts/social/meta-post.mjs "${en[@]}" > "$en_result" || echo "::warning::Scheduling the English Facebook Reel failed; see the result line."
              cat "$en_result"
              echo "en_result=$en_result" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::The Graph API path did not run ($status); Make posts Facebook and Instagram instead."
          fi

      - name: Publish to the LinkedIn Page (Pipedream or LinkedIn API)
        id: linkedin
        if: steps.pick.outputs.slug != ''
        env:
          LINKEDIN_VIA: ${{ inputs.linkedin_via || vars.LINKEDIN_VIA }}
          PIPEDREAM_CLIENT_ID: ${{ secrets.PIPEDREAM_CLIENT_ID }}
          PIPEDREAM_CLIENT_SECRET: ${{ secrets.PIPEDREAM_CLIENT_SECRET }}
          PIPEDREAM_PROJECT_ID: ${{ secrets.PIPEDREAM_PROJECT_ID }}
          PIPEDREAM_ENVIRONMENT: ${{ secrets.PIPEDREAM_ENVIRONMENT }}
          CRM_URL: ${{ vars.CRM_URL || 'https://epifive-crm.pages.dev' }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          REELS_HOST_REPO: ${{ github.repository }}
          REELS_HOST_TOKEN: ${{ github.token }}
          LINKEDIN_PAGE_TOKEN: ${{ secrets.LINKEDIN_PAGE_TOKEN }}
          LINKEDIN_PAGE_TOKEN_EXPIRES: ${{ vars.LINKEDIN_PAGE_TOKEN_EXPIRES }}
          LINKEDIN_FORMATS: ${{ vars.LINKEDIN_FORMATS }}
          SLUG: ${{ steps.pick.outputs.slug }}
          DIR: ${{ steps.pick.outputs.dir }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "direct=false" >> "$GITHUB_OUTPUT"
          if [ "$LINKEDIN_VIA" = pipedream ]; then
            poster=scripts/social/linkedin-pipedream.mjs; label="Pipedream"
          elif [ -n "$LINKEDIN_PAGE_TOKEN" ] || [ -n "$INGEST_TOKEN" ]; then
            # Token: CRM "Connect LinkedIn (Page)" (fetched by linkedin-post.mjs with INGEST_TOKEN + this job's GitHub OIDC
            # token, id-token: write above) or the PC backup secret LINKEDIN_PAGE_TOKEN, whichever expires later.
            poster=scripts/social/linkedin-post.mjs; label="LinkedIn API"
          else
            echo "::notice::LINKEDIN_VIA is not pipedream and no LinkedIn Page token is set up; the LinkedIn Page goes through Make."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            node "$poster" page "$SLUG" "$DIR" --dry-run || true
            exit 0
          fi
          result="$RUNNER_TEMP/linkedin-result.json"
          node "$poster" page "$SLUG" "$DIR" > "$result" || echo "::warning::The LinkedIn Page post via $label failed; see the result line."
          cat "$result"
          take=$(node -p "try { const r = JSON.parse(require('fs').readFileSync('$result', 'utf8').trim().split('\n').pop()); r.status === 'ok' || (r.status === 'error' && r.safeToRetry === false) ? 'api' : 'make' } catch { 'make' }")
          if [ "$take" = api ]; then
            echo "direct=true" >> "$GITHUB_OUTPUT"
            echo "result=$result" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$label did not post the LinkedIn Page (not configured, no Page chosen in the CRM, expired connection or refused); Make posts it instead."
          fi

      - name: Publish via Make (LinkedIn; Facebook and Instagram only as the fallback)
        id: make
        if: steps.pick.outputs.slug != '' && !inputs.dry_run
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
          LINKEDIN_FORMATS: ${{ vars.LINKEDIN_FORMATS }}
          SLUG: ${{ steps.pick.outputs.slug }}
          DIR: ${{ steps.pick.outputs.dir }}
          META_DIRECT: ${{ steps.meta.outputs.direct }}
          LI_DIRECT: ${{ steps.linkedin.outputs.direct }}
          ONLY: ${{ steps.meta.outputs.direct == 'true' && '--linkedin-only' || (steps.linkedin.outputs.direct == 'true' && '--no-linkedin' || '') }}
        run: |
          if [ "$META_DIRECT" = true ] && [ "$LI_DIRECT" = true ]; then
            echo "result=drafts-only" >> "$GITHUB_OUTPUT"
            echo "::notice::Facebook, Instagram and LinkedIn all went out through their own APIs; Make is not needed."
            exit 0
          fi
          if [ -z "$MAKE_WEBHOOK_URL" ]; then
            echo "result=drafts-only" >> "$GITHUB_OUTPUT"
            echo "::notice::MAKE_WEBHOOK_URL not set; $([ "$LI_DIRECT" = true ] && echo 'Facebook/Instagram fallback skipped' || echo 'LinkedIn is draft only')."
            exit 0
          fi
          mkdir -p public/social
          cutoff=$(date -d '14 days ago' +%s)
          for f in public/social/*; do
            [ -f "$f" ] || continue
            added=$(git log -1 --format=%ct -- "$f")
            if [ -n "$added" ] && [ "$added" -lt "$cutoff" ]; then git rm -q "$f"; fi
          done
          cp "${{ steps.media.outputs.social }}" "public/social/$SLUG.mp4"
          cp "$DIR/card.jpg" "public/social/$SLUG.jpg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/social
          git commit -q -m "Host social media for $SLUG"
          for i in 1 2 3; do git pull -q --rebase "$SITE_REMOTE" main && git push -q "$SITE_REMOTE" HEAD:main && break; sleep 10; done
          node scripts/social/make-send.mjs "$SLUG" "$DIR" $ONLY > "$RUNNER_TEMP/make-result.json" \
            || echo "::warning::Sending to Make failed; see the log line."
          cat "$RUNNER_TEMP/make-result.json"
          echo "result=$RUNNER_TEMP/make-result.json" >> "$GITHUB_OUTPUT"

      - name: Publish to YouTube Shorts
        id: youtube
        if: steps.pick.outputs.slug != '' && !inputs.dry_run
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DIR: ${{ steps.pick.outputs.dir }}
          HI: ${{ steps.hi.outputs.ok == 'true' }}
          EN_AT: ${{ steps.hi.outputs.en_at }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "result=drafts-only" >> "$GITHUB_OUTPUT"
            echo "::notice::YouTube credentials not set; drafts only."
            exit 0
          fi
          en=()
          if [ "$HI" = true ]; then
            node scripts/social/youtube.mjs upload --video "$DIR/hi/reel.mp4" --meta "$DIR/hi/youtube.txt" --captions "$DIR/hi/captions.srt" \
              --lang hi --playlist-name "Tech fixes in Hinglish" > "$RUNNER_TEMP/yt-hi-result.json" || echo "::warning::Hinglish YouTube upload failed; see the log line."
            cat "$RUNNER_TEMP/yt-hi-result.json"
            echo "hi_result=$RUNNER_TEMP/yt-hi-result.json" >> "$GITHUB_OUTPUT"
            en=(--publish-at "$EN_AT")
          fi
          node scripts/social/youtube.mjs upload --video "${{ steps.media.outputs.youtube }}" --meta "$DIR/youtube.txt" --captions "${{ steps.media.outputs.captions }}" "${en[@]}" \
            > "$RUNNER_TEMP/yt-result.json" || echo "::warning::YouTube upload failed; see the log line."
          cat "$RUNNER_TEMP/yt-result.json"
          echo "result=$RUNNER_TEMP/yt-result.json" >> "$GITHUB_OUTPUT"

      - name: Log and push
        if: >-
          steps.pick.outputs.slug != '' && steps.make.outcome == 'success' &&
          steps.meta.outcome != 'failure' && steps.youtube.outcome == 'success'
        env:
          HI_YT: ${{ steps.youtube.outputs.hi_result }}
          EN_META: ${{ steps.meta.outputs.en_result }}
          IG_EN: ${{ steps.hi.outputs.ok == 'true' && steps.meta.outputs.direct == 'true' && (vars.REELS_LATER == 'on' && format('queued {0}', steps.hi.outputs.en_at) || 'off (REELS_LATER not on)') || '' }}
          LI_API: ${{ steps.linkedin.outputs.result }}
        run: |
          set --
          [ -n "$LI_API" ] && set -- "$@" --linkedin "$LI_API"
          [ -n "$HI_YT" ] && set -- "$@" --hi-yt "$HI_YT"
          [ -n "$EN_META" ] && set -- "$@" --en-meta "$EN_META"
          [ -n "$IG_EN" ] && set -- "$@" --en-ig "$IG_EN"
          node scripts/social/log.mjs "${{ steps.pick.outputs.slug }}" "${{ steps.meta.outputs.result || 'drafts-only' }}" \
            "${{ steps.youtube.outputs.result }}" "${{ steps.make.outputs.result }}" "$@" | tee "$RUNNER_TEMP/log-line.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/social-log.md
          git commit -q -m "Log social share for ${{ steps.pick.outputs.slug }}"
          for i in 1 2 3; do git pull -q --rebase "$SITE_REMOTE" main && git push -q "$SITE_REMOTE" HEAD:main && break; sleep 10; done

      - name: Summary
        if: always() && steps.pick.outputs.slug != ''
        env:
          DIR: ${{ steps.pick.outputs.dir }}
        run: |
          {
            echo "## ${{ steps.pick.outputs.slug }}"
            echo
            [ -f "$RUNNER_TEMP/log-line.txt" ] && { echo '```text'; cat "$RUNNER_TEMP/log-line.txt"; echo '```'; }
            echo
            echo "### LinkedIn post (upload reel.mp4 from the artifact below with this text)"
            echo
            echo '```text'
            cat "$DIR/linkedin.txt" 2>/dev/null || echo "(not written)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload drafts and video
        if: always() && steps.pick.outputs.slug != ''
        uses: actions/upload-artifact@v4
        with:
          name: social-${{ steps.pick.outputs.slug }}
          path: ${{ steps.pick.outputs.dir }}
          retention-days: 90
          if-no-files-found: ignore

      - name: Queue the English Instagram Reel
        if: >-
          steps.pick.outputs.slug != '' && !inputs.dry_run && vars.REELS_LATER == 'on' &&
          steps.hi.outputs.ok == 'true' && steps.meta.outputs.direct == 'true'
        continue-on-error: true
        env:
          SLUG: ${{ steps.pick.outputs.slug }}
          EN_AT: ${{ steps.hi.outputs.en_at }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$RUNNER_TEMP/auto"
          cd "$RUNNER_TEMP/auto"
          node "$GITHUB_WORKSPACE/ops/reels/queue.mjs" add --file reels/queue.jsonl --slug "$SLUG" --run "${{ github.run_id }}" --artifact "social-$SLUG" --due "$EN_AT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels/queue.jsonl
          git commit -qm "Queue English Instagram Reel: $SLUG at $EN_AT"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
