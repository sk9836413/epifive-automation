# Launch radar: watches official product feeds (radar/sources.json) and publishes a same-day step-by-step
# how-to for a big launch ("fast track", site instructions automation/RADAR.md), on top of the daily article.
# Sources with category "incident" (security news, vendor security blogs) add same-day security incident guides
# ("what happened / am I affected / what to do now / how to prevent it"), under the same daily caps.
# Big service outages on major platforms (news feeds, and status pages with category "outage") add outage guides
# ("what happened / how to check status / what users and admins can do / SLA credits / post-incident review").
#
# When: no cron of its own. It starts whenever the scheduler requests the Daily article (43 3 and 43 4 UTC) or
# Social media (13 5, 16 13 and 16 14 UTC) workflow, so it rides the scheduler's 5 existing slots (up to 5 scans
# a day; a scan within 25 minutes of the last one is skipped). A scan is plain Node (a few seconds, no Claude).
# Caps: at most 2 fast-track articles a day (3 attempts), plus 1 extra a day for a major outage once those are used
# up, and 2 updates of existing posts a day. A draft that fails the
# quality gate gets one fix attempt, then the launch is parked in automation/backlog.md "(fast-track, failed gate)".
# Trending videos: when a new outage or incident guide, or a fast-track article that scored 12 or more, is published,
# the write job starts the Short (social.yml, force) and the long video (longvideo.yml, publish_now: public on
# YouTube and the Facebook Page at once) for it. At most 1 such pair a UTC day; consumer topics get the Short only
# (radar/lib.mjs autoVideoPlan). A Social media run started that way (github-actions[bot]) starts no extra scan.
# Email alerts: when a new outage guide (or security incident guide) is published and live, the write job sends one
# short Resend broadcast to the readers who signed up in the article box (segments "Alerts: outage" / "Alerts: security"):
# 1 per incident, at most 2 a day (1 security), never for an update or a resolved outage (radar/alert.mjs). Secret
# RESEND_API_KEY; optional ALERT_POSTAL_ADDRESS (the CAN-SPAM postal footer). Logged in radar/results.jsonl (type alert).
# Tiers (radar/brief.mjs, owner asked 14 Nov 2026 for every IT/tech/AI/device update within about an hour):
#   Tier 1 = the fast-track article above (caps unchanged); flagship devices (new iPhone, Galaxy S/Z, Pixel), new
#            flagship AI models from OpenAI/Anthropic/Google/Meta, big AI price drops and AI model retirements due within
#            120 days get a score floor, still inside the same 2 + 1 outage cap.
#   Tier 2 = every relevant item from every source on ONE page per day, radar/live/<IST date>.json, served live by the
#            site at https://www.epifive.com/news/live/<date> (Pages Function, no site rebuild). 2-4 factual lines per
#            item from one batched Claude call per scan (haiku, no tools; lines are checked so every number comes from
#            the official text, else template lines from the official text). Dedupe across sources and 3 days.
#            IndexNow ping for the day page at most once an hour, only when it changed.
#            Trending tier (radar/trending.mjs, owner asked 15 Nov 2026): big general tech stories from Techmeme and Google
#            News that Techmeme lists or 3+ reputable outlets cover (leadership/IPOs at major tech companies, big product,
#            AI, space and EV milestones, critical-infrastructure outages), safety-filtered, "Reported by <outlet>", 4 a day.
#   Tier 3 = official device launches start devices.yml in launch mode (spec page from the maker's official page only),
#            at most 2 runs a day, 3 devices a run.
# Patch Tuesday (owner approved 19 Nov 2026): from 18:00 UTC on the second Tuesday, once MSRC lists the month's release,
# the scan queues "patch-tuesday-<yyyy-mm>" as a Tier 1 fast-track (category patch-tuesday, top score, same daily caps). The
# write job gives the writer Microsoft's official counts (radar/patch-tuesday.mjs: MSRC CVRF + CISA KEV); the post joins
# https://www.epifive.com/patch-tuesday and its email goes to the Security alerts list. No cron change.
# Off switch: repository variable RADAR (automatic scans run only while it is "on").
# Logs (public, no secrets): radar/log/<YYYY-MM>.md per scan, radar/results.jsonl per write, radar/live/ day pages.
name: Launch radar

on:
  workflow_run:
    workflows: [Daily article, Social media]
    types: [requested]
  # Hourly scan (owner approved 13 Nov 2026, "jod do") so an overnight outage or launch is caught within about an
  # hour. GitHub's own scheduler (free for this public repo), not the Cloudflare scheduler, whose 5 slots are fixed.
  # The scan is a ~5 s Node script with no Claude; the 25-minute gap and the daily caps still apply.
  schedule:
    - cron: '7,23,38,53 * * * *'   # four tries an hour: GitHub drops many scheduled runs; the 25-minute gap guard keeps it to ~1-2 scans an hour
  workflow_dispatch:
    inputs:
      mode:
        description: scan (default) or write (started by a scan)
        type: choice
        options: [scan, write]
        default: scan
      dry_run:
        description: Score and draft, but publish nothing and save no radar state
        type: boolean
        default: false
      force_url:
        description: Fast-track this official URL now (skips the threshold and daily caps)
        type: string
        default: ''
      force_category:
        description: With force_url, write a launch how-to, a security incident guide or an outage guide
        type: choice
        options: [launch, incident, outage]
        default: launch
      task:
        description: Task JSON (write mode only; the scan fills it in)
        type: string
        default: ''

permissions:
  contents: write
  actions: write
  id-token: write

env:
  SITE_REMOTE: https://x-access-token:${{ secrets.SITE_REPO_TOKEN }}@github.com/sk9836413/EPIVIFE.git

jobs:
  scan:
    # Automatic scans need the repository variable RADAR = on (the off switch); manual runs always work.
    # A Social media run this workflow started itself (the trending Short, github-actions[bot]) starts no extra scan.
    if: >-
      (github.event_name == 'workflow_run' && vars.RADAR == 'on' && github.event.workflow_run.triggering_actor.login != 'github-actions[bot]') ||
      (github.event_name == 'schedule' && vars.RADAR == 'on') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'write')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: radar-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@v4
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site
          sparse-checkout: |
            content/posts
            content/news
            content/devices
            automation

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Unit tests
        run: node --test radar/radar.test.mjs radar/alert.test.mjs radar/brief.test.mjs radar/status.test.mjs radar/retirements.test.mjs radar/patch-tuesday.test.mjs

      - name: Scan
        id: scan
        shell: bash
        env:
          DRY: ${{ inputs.dry_run && 'true' || '' }}
          FORCE_URL: ${{ inputs.force_url }}
          FORCE_CATEGORY: ${{ inputs.force_category }}
          TRIGGER: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name || github.event_name == 'schedule' && 'hourly schedule' || 'manual' }}
        run: |
          args=(scan --site site --out task.json --brief-out "$RUNNER_TEMP/brief.json" --trigger "$TRIGGER")
          [ -n "$DRY" ] && args+=(--dry-run)
          [ -n "$FORCE_URL" ] && args+=(--force-url "$FORCE_URL" --force-category "${FORCE_CATEGORY:-launch}")
          node radar/radar.mjs "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Park expired launches in the site backlog
        if: steps.scan.outputs.parks == 'true' && !inputs.dry_run
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q "$SITE_REMOTE" main && git checkout -q -f -B radar FETCH_HEAD || { sleep 10; continue; }
            node ../radar/radar.mjs site-apply --site . --task ../task.json
            git add automation/backlog.md
            git diff --cached --quiet && break
            git commit -q -m "Radar: queue launches that missed the fast-track cap"
            git push -q "$SITE_REMOTE" HEAD:main && break
            sleep 10
          done

      # Tier 2: one batched Claude call for the new items on today's news page (haiku, no tools, one turn). The scan
      # already wrote template lines from the official text, so a failure here (usage limit, timeout) changes nothing.
      - name: News page lines (Claude)
        id: lines
        if: steps.scan.outputs.brief_pending == 'true' && !inputs.dry_run
        continue-on-error: true
        timeout-minutes: 6
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code --silent --no-audit --no-fund
          claude -p --model haiku --tools "" --max-turns 1 --output-format text \
            --system-prompt "You write short factual lines for a technology news page. Use only the facts in the input. Answer with JSON only." \
            < "$RUNNER_TEMP/brief.json.prompt.txt" > "$RUNNER_TEMP/brief-answer.txt"
          wc -c "$RUNNER_TEMP/brief-answer.txt"

      - name: News page lines (check and apply)
        if: steps.scan.outputs.brief_pending == 'true' && !inputs.dry_run
        run: node radar/radar.mjs brief-apply --pending "$RUNNER_TEMP/brief.json" --answer "$RUNNER_TEMP/brief-answer.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      # Site pages that render from this repo without a rebuild (owner approved 19 Nov 2026):
      # radar/status/recent.json = recent outage items per service for https://www.epifive.com/status/<service>
      # (the pages read the vendors' official status feeds themselves); radar/retirements.json = the Microsoft 365
      # retirement calendar (https://www.epifive.com/microsoft-365-retirements, its ICS and RSS), rebuilt from the
      # official notices at most every 6 hours. Both are plain Node, no Claude; a failure here changes nothing else.
      - name: Status snapshot and retirement calendar
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: |
          node radar/status.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          node radar/retirements.mjs --site site | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save radar state and log
        if: ${{ !inputs.dry_run }}
        run: |
          git add radar/state.json radar/log
          git add radar/status radar/retirements.json 2>/dev/null || true
          if [ -d radar/live ]; then git add radar/live; fi
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Radar scan $(TZ=Asia/Kolkata date '+%F %H:%M') IST"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done

      # The news page reads radar/live from this public repo (raw.githubusercontent.com, cached up to 5 minutes), so it is
      # live once the push lands. IndexNow: only when today's page changed, at most once an hour (the scan decides).
      - name: Ping IndexNow for the news page
        if: steps.scan.outputs.brief_ping != '' && !inputs.dry_run
        continue-on-error: true
        env:
          URL: ${{ steps.scan.outputs.brief_ping }}
        run: |
          sleep 60
          node radar/radar.mjs indexnow --url "$URL"

      # Tier 3: official device launches go to the device portal (devices.yml launch mode: the maker's spec page only).
      - name: Start the device portal job
        if: steps.scan.outputs.devices_count != '' && !inputs.dry_run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.scan.outputs.devices_count }}
          FOCUS: ${{ steps.scan.outputs.devices_focus }}
        run: gh workflow run devices.yml --repo "$GITHUB_REPOSITORY" --ref main -f count="$COUNT" -f focus="$FOCUS" -f force=true

      - name: Start the writer
        if: steps.scan.outputs.kind != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dry_run && 'true' || 'false' }}
        run: gh workflow run radar.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=write -f dry_run="$DRY" -f task="$(cat task.json)"

  write:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'write'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: radar-write
      cancel-in-progress: false
    steps:
      - name: Check Claude token
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "ready=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set."; exit 1; fi

      - uses: actions/checkout@v4
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}

      - uses: actions/checkout@v4
        with:
          ref: main
          path: _radar

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Task
        id: task
        env:
          TASK: ${{ inputs.task }}
        run: |
          printf '%s' "$TASK" > .radar-task.json
          printf '_radar/\n.radar-*\n' >> .git/info/exclude
          node -e '
            const t = JSON.parse(require("fs").readFileSync(".radar-task.json", "utf8"));
            if (!["new", "update"].includes(t.kind) || !t.key || !t.link) { console.error("Bad task"); process.exit(1); }
            if (t.kind === "update" && !/^[a-z0-9-]+$/.test(t.slug ?? "")) { console.error("Update without a valid slug"); process.exit(1); }
            const category = ["incident", "outage", "patch-tuesday"].includes(t.category) ? t.category : "launch";
            const pt = /^[0-9]{4}-[0-9]{2}$/.test(t.patchTuesday ?? "") ? t.patchTuesday : "";
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `kind=${t.kind}\nkey=ok\nslug=${t.slug ?? ""}\ncategory=${category}\npatch_tuesday=${pt}\n`);
            console.log(`${t.kind} (${category}): ${t.title}\n${t.link}\nscore ${t.score}: ${(t.reasons ?? []).join("; ")}`);
          '
          echo "today=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      # Patch Tuesday (category patch-tuesday): Microsoft's official counts for the month from the MSRC CVRF release and
      # CISA's KEV feed (radar/patch-tuesday.mjs), so the writer never has to read the 19 MB CVRF file itself. .radar-* is
      # git-excluded above. A failure here leaves the writer to open the official pages itself.
      - name: Patch Tuesday data (MSRC CVRF + CISA KEV)
        if: steps.task.outputs.patch_tuesday != ''
        continue-on-error: true
        env:
          MONTH: ${{ steps.task.outputs.patch_tuesday }}
        run: node _radar/radar/patch-tuesday.mjs summary --month "$MONTH" --out .radar-patch-tuesday.json

      - name: Write (Claude, attempt 1)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The write run is started by the scan job (github-actions bot), so the action must accept a bot actor.
          allowed_bots: "*"
          claude_args: |
            --max-turns 150
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/check-posts.mjs:*),Bash(node _radar/radar/radar.mjs check:*),Bash(ls:*),Bash(wc:*)"
          prompt: |
            Launch radar fast-track, mode "${{ steps.task.outputs.kind }}", category "${{ steps.task.outputs.category }}".
            Today's date (IST) is ${{ steps.task.outputs.today }}. For category "incident", follow the "Security incidents"
            section of RADAR.md (primary sources first, label claims as claims, name no individuals, no speculation, only
            published indicators of compromise). For category "outage", follow the "Outages" section of RADAR.md (status
            "as of <time> IST" with a timestamp, vendor status updates quoted exactly with times, IST and ET timeline, no
            speculation on the cause beyond what the vendor said, SLA credits only from the vendor's SLA document).
            For category "patch-tuesday", follow the "Patch Tuesday" section of RADAR.md: Microsoft's official counts are in
            .radar-patch-tuesday.json (MSRC CVRF data and CISA's KEV feed) and the slug is the "backlog" value in .radar-task.json.
            The item is described in .radar-task.json. Read automation/RADAR.md and follow it exactly (it builds on
            automation/WRITER.md, which you should also read). The repository is already checked out at the latest main.
            Do not run npm, git or a build, and do not edit automation/backlog.md or automation/log.md: later workflow
            steps check, build, publish and record. Never mention any person's name; publish under the EpiFive brand only.

      - name: Find the article
        id: post
        env:
          KIND: ${{ steps.task.outputs.kind }}
          SLUG: ${{ steps.task.outputs.slug }}
        run: |
          # Only content/posts may change; undo anything else the writer touched.
          git status --porcelain --untracked-files=all | awk '{print $2}' | grep -v '^content/posts/' | while read -r f; do
            echo "::warning::Reverting unexpected change: $f"
            git checkout -q -- "$f" 2>/dev/null || rm -f "$f"
          done
          if [ "$KIND" = "new" ]; then
            files=$(git status --porcelain --untracked-files=all content/posts | awk '/^\?\?/ {print $2}')
          else
            files=$(git status --porcelain content/posts | awk '{print $2}')
          fi
          count=$(printf '%s' "$files" | grep -c . || true)
          if [ "$count" = "0" ]; then echo "::notice::The writer wrote nothing (RADAR-SKIP)."; exit 0; fi
          if [ "$count" != "1" ]; then echo "::error::Expected one article, found $count: $files"; exit 1; fi
          if [ "$KIND" = "update" ] && [ "$files" != "content/posts/$SLUG.md" ]; then echo "::error::Update changed $files, expected $SLUG"; exit 1; fi
          slug=$(basename "$files" | sed -E 's/\.mdx?$//')
          echo "file=$files" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          node -e 'require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "title=" + require("gray-matter").read(process.argv[1]).data.title.replace(/\n/g, " ") + "\n")' "$files"

      - name: Quality gate (attempt 1)
        id: gate1
        if: steps.post.outputs.file != ''
        env:
          FILE: ${{ steps.post.outputs.file }}
          SLUG: ${{ steps.post.outputs.slug }}
          KIND: ${{ steps.task.outputs.kind }}
          CATEGORY: ${{ steps.task.outputs.category }}
          TODAY: ${{ steps.task.outputs.today }}
        run: |
          set +e
          { node scripts/check-posts.mjs "$SLUG" && node _radar/radar/radar.mjs check --file "$FILE" --kind "$KIND" --today "$TODAY" --category "$CATEGORY"; } > .radar-gate.txt 2>&1
          rc=$?
          cat .radar-gate.txt
          if [ $rc = 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Fix (Claude, attempt 2)
        if: steps.gate1.outputs.ok == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The write run is started by the scan job (github-actions bot), so the action must accept a bot actor.
          allowed_bots: "*"
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/check-posts.mjs:*),Bash(node _radar/radar/radar.mjs check:*),Bash(ls:*),Bash(wc:*)"
          prompt: |
            The quality gate failed for ${{ steps.post.outputs.file }} (launch radar, mode "${{ steps.task.outputs.kind }}", category "${{ steps.task.outputs.category }}",
            today ${{ steps.task.outputs.today }}). The errors are in .radar-gate.txt. Fix them in that one file only,
            following automation/RADAR.md and automation/WRITER.md: add real, official-source content where something is
            missing, never invented facts. Re-run both checks named in RADAR.md until they pass. Edit no other file.

      - name: Quality gate (attempt 2)
        id: gate2
        if: steps.gate1.outputs.ok == 'false'
        env:
          FILE: ${{ steps.post.outputs.file }}
          SLUG: ${{ steps.post.outputs.slug }}
          KIND: ${{ steps.task.outputs.kind }}
          CATEGORY: ${{ steps.task.outputs.category }}
          TODAY: ${{ steps.task.outputs.today }}
        run: |
          set +e
          { node scripts/check-posts.mjs "$SLUG" && node _radar/radar/radar.mjs check --file "$FILE" --kind "$KIND" --today "$TODAY" --category "$CATEGORY"; } > .radar-gate.txt 2>&1
          rc=$?
          cat .radar-gate.txt
          if [ $rc = 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build
        id: build
        if: steps.gate1.outputs.ok == 'true' || steps.gate2.outputs.ok == 'true'
        continue-on-error: true
        run: npm run build

      - name: Verdict
        id: verdict
        env:
          FILE: ${{ steps.post.outputs.file }}
          PASSED: ${{ (steps.gate1.outputs.ok == 'true' || steps.gate2.outputs.ok == 'true') && steps.build.outcome == 'success' }}
        run: |
          if [ -z "$FILE" ]; then r=skipped; elif [ "$PASSED" = "true" ]; then r=published; else r=failed; fi
          echo "result=$r" >> "$GITHUB_OUTPUT"
          echo "Verdict: $r"

      - name: Upload the draft
        if: always() && steps.post.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ steps.post.outputs.slug }}
          path: |
            ${{ steps.post.outputs.file }}
            .radar-task.json
            .radar-gate.txt
          include-hidden-files: true
          retention-days: 30

      - name: Publish (or park a failed draft in the backlog)
        id: publish
        if: ${{ !inputs.dry_run && (steps.verdict.outputs.result == 'published' || (steps.verdict.outputs.result == 'failed' && steps.task.outputs.kind == 'new')) }}
        env:
          RESULT: ${{ steps.verdict.outputs.result }}
          FILE: ${{ steps.post.outputs.file }}
          SLUG: ${{ steps.post.outputs.slug }}
          KIND: ${{ steps.task.outputs.kind }}
          TITLE: ${{ steps.post.outputs.title }}
          TODAY: ${{ steps.task.outputs.today }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$FILE" "$RUNNER_TEMP/post.md"
          if [ "$RESULT" = "published" ]; then
            [ "$KIND" = "update" ] && msg="Update article: $TITLE" || msg="Add fast-track article: $TITLE"
          else
            msg="Radar: park $SLUG (fast-track, failed gate)"
          fi
          done=""
          # Re-apply on a fresh main each try, so a concurrent daily article never causes a rebase conflict.
          for i in 1 2 3 4; do
            git fetch -q "$SITE_REMOTE" main && git checkout -q -f -B radar-pub FETCH_HEAD || { sleep 10; continue; }
            if [ "$RESULT" = "published" ]; then
              cp "$RUNNER_TEMP/post.md" "$FILE"
              node _radar/radar/radar.mjs site-apply --site . --task .radar-task.json --result published --file "$FILE" --date "$TODAY"
              git add "$FILE" automation/backlog.md automation/log.md
            else
              rm -f "$FILE"
              node _radar/radar/radar.mjs site-apply --site . --task .radar-task.json --result failed --slug "$SLUG" --date "$TODAY"
              git add automation/backlog.md
            fi
            git diff --cached --quiet && { done=1; break; }
            git commit -q -m "$msg" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
            git push -q "$SITE_REMOTE" HEAD:main && { done=1; break; }
            sleep 10
          done
          [ -n "$done" ] || { echo "::error::Could not push to the site repo"; exit 1; }

      # Pushes made by this job don't trigger the IndexNow workflow, so ping here once the page is live.
      - name: Ping IndexNow
        if: ${{ !inputs.dry_run && steps.verdict.outputs.result == 'published' && steps.publish.outcome == 'success' }}
        env:
          URL: https://www.epifive.com/blog/${{ steps.post.outputs.slug }}
          KIND: ${{ steps.task.outputs.kind }}
          TODAY: ${{ steps.task.outputs.today }}
        run: |
          for i in $(seq 1 40); do
            if [ "$KIND" = "update" ]; then curl -s "$URL" | grep -q "Updated $TODAY" && break
            else [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL")" = "200" ] && break; fi
            sleep 20
          done
          node scripts/seo/indexnow.mjs "$URL"

      # Email alert to the "Outage alerts" / "Security alerts" list for a new outage or incident guide (radar/alert.mjs):
      # 1 per incident, at most 2 a day, never an update or a resolved outage; waits until the page is live. Appends to
      # _radar/radar/results.jsonl, which "Record the outcome" commits. Dry run: prints the email, sends and logs nothing.
      # Never fails the run.
      - name: Email alert
        if: steps.verdict.outputs.result == 'published' && (inputs.dry_run || steps.publish.outcome == 'success') && (steps.task.outputs.category == 'outage' || steps.task.outputs.category == 'incident' || steps.task.outputs.category == 'patch-tuesday')
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_POSTAL_ADDRESS: ${{ secrets.ALERT_POSTAL_ADDRESS }}
          DRY: ${{ inputs.dry_run && 'true' || 'false' }}
          FILE: ${{ steps.post.outputs.file }}
        run: |
          args=(alert --site . --task .radar-task.json --status published --file "$FILE")
          [ "$DRY" = true ] && args+=(--dry-run)
          node _radar/radar/radar.mjs "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Views on a trending topic come in the first hours: an outage or incident guide, or a fast-track article that
      # scored 12+, starts the Short (social.yml, force) and the long video (longvideo.yml, publish_now = public on
      # YouTube and the Facebook Page at once) as soon as the page is live. At most 1 pair a UTC day, counted in
      # radar/results.jsonl (autoVideo); consumer topics get the Short only (radar/lib.mjs autoVideoPlan). GITHUB_TOKEN
      # may start workflow_dispatch runs in this repo (actions: write, as the scan does for this job). Dry run: prints
      # the commands only. Never fails the run.
      # Owner plan, 16 Nov 2026: videos only for fixes/how-tos. Outage and incident guides (news) start nothing; any other
      # article only when the site's classifier (scripts/social/video-kind.mjs) calls it a fix. social.yml and
      # longvideo.yml check again (no allow_news here) and social.yml keeps to one topic a UTC day.
      - name: Trending Short and long video
        id: videos
        if: steps.verdict.outputs.result == 'published' && (inputs.dry_run || steps.publish.outcome == 'success')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dry_run && 'true' || 'false' }}
          FILE: ${{ steps.post.outputs.file }}
        run: |
          plan=$(node _radar/radar/radar.mjs video-plan --site . --task .radar-task.json --status published --file "$FILE")
          echo "$plan"
          get() { node -e 'const v = JSON.parse(process.argv[1])[process.argv[2]]; process.stdout.write(v == null ? "" : String(v))' "$plan" "$1"; }
          if [ "$(get dispatch)" != true ]; then
            echo "Trending videos: none ($(get reason))." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          start() {
            if [ "$DRY" = true ]; then echo "[dry run] gh workflow run $*"; else gh workflow run "$@" --repo "$GITHUB_REPOSITORY" --ref main; fi
          }
          slug=$(get slug)
          start social.yml -f slug="$slug" -f force=true -f brief="$(get brief)"
          # Counted for the daily cap as soon as anything started.
          [ "$DRY" = true ] || echo "day=$(get day)" >> "$GITHUB_OUTPUT"
          if [ "$(get long)" = true ]; then
            start longvideo.yml -f mode=video -f slug="$slug" -f force=true -f publish_now=true -f upload=true
            long="long video public at once"
            [ "$(get replacesDaily)" = true ] && long="$long (replaces today's daily long video if it starts first)"
          else
            long="no long video: $(get longSkipped)"
          fi
          echo "Trending videos for $slug ($(get reason)): Short + $long.$([ "$DRY" = true ] && echo ' Dry run: nothing started.')" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record the outcome
        if: always() && steps.task.outputs.key == 'ok' && !inputs.dry_run
        working-directory: _radar
        env:
          RESULT: ${{ steps.verdict.outputs.result }}
          PUBLISHED: ${{ steps.publish.outcome }}
          SLUG: ${{ steps.post.outputs.slug }}
          TITLE: ${{ steps.post.outputs.title }}
          AUTO_VIDEO: ${{ steps.videos.outputs.day }}
        run: |
          status="${RESULT:-error}"
          if [ "$status" = "published" ] && [ "$PUBLISHED" != "success" ]; then status=error; fi
          args=(record --task ../.radar-task.json --status "$status")
          [ -n "$AUTO_VIDEO" ] && args+=(--auto-video "$AUTO_VIDEO")
          [ -n "$SLUG" ] && args+=(--slug "$SLUG")
          [ -n "$TITLE" ] && args+=(--title "$TITLE")
          node radar/radar.mjs "${args[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar/results.jsonl
          git commit -q -m "Radar result: $status ${SLUG:-}"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done

      - name: Summary
        if: always()
        env:
          TITLE: ${{ steps.post.outputs.title }}
          SLUG: ${{ steps.post.outputs.slug }}
          FILE: ${{ steps.post.outputs.file }}
          RESULT: ${{ steps.verdict.outputs.result }}
          DRY: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Launch radar: ${RESULT:-error}"
            echo
            [ -n "$TITLE" ] && echo "**$TITLE**" && echo && echo "https://www.epifive.com/blog/$SLUG"
            [ -n "$FILE" ] && [ -f "$FILE" ] && echo && echo "Words (including code): $(sed '1,/^---$/d' "$FILE" | wc -w)"
            [ -n "$FILE" ] && [ -f "$FILE" ] && echo && echo '### Outline' && grep -E '^##+ ' "$FILE"
            [ -f .radar-gate.txt ] && echo && echo '### Gate' && echo '```text' && cat .radar-gate.txt && echo '```'
            [ "$DRY" = "true" ] && echo && echo "_Dry run: nothing was published._"
            true # the last test above is false on real runs; without this the step (and the run) showed "failed"
          } >> "$GITHUB_STEP_SUMMARY"
