# Launch radar. Code, prompts and notes live in the private repo (ops/; annotated copy: ops/docs/workflow-notes/radar.yml).
name: Launch radar

on:
  workflow_run:
    workflows: [Daily article, Social media]
    types: [requested]
  schedule:
    - cron: '7,23,38,53 * * * *'   # four tries an hour: GitHub drops many scheduled runs; the 25-minute gap guard keeps it to ~1-2 scans an hour
  workflow_dispatch:
    inputs:
      mode:
        description: scan (default) or write (started by a scan)
        type: choice
        options: [scan, write]
        default: scan
      dry_run:
        description: Score and draft, but publish nothing and save no radar state
        type: boolean
        default: false
      force_url:
        description: Fast-track this official URL now (skips the threshold and daily caps)
        type: string
        default: ''
      force_category:
        description: With force_url, write a launch how-to, a security incident guide or an outage guide
        type: choice
        options: [launch, incident, outage]
        default: launch
      task:
        description: Task JSON (write mode only; the scan fills it in)
        type: string
        default: ''

permissions:
  contents: write
  actions: write
  id-token: write

env:
  SITE_REMOTE: https://x-access-token:${{ secrets.SITE_REPO_TOKEN }}@github.com/sk9836413/EPIVIFE.git

jobs:
  scan:
    if: >-
      (github.event_name == 'workflow_run' && vars.RADAR == 'on' && github.event.workflow_run.triggering_actor.login != 'github-actions[bot]') ||
      (github.event_name == 'schedule' && vars.RADAR == 'on') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'write')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: radar-scan
      cancel-in-progress: false
    env:
      RADAR_DATA: ${{ github.workspace }}/radar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@v4
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site
          sparse-checkout: |
            content/posts
            content/news
            content/devices
            automation
            ops/radar
            ops/prompts

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Unit tests
        run: node --test site/ops/radar/*.test.mjs

      - name: Scan
        id: scan
        shell: bash
        env:
          DRY: ${{ inputs.dry_run && 'true' || '' }}
          FORCE_URL: ${{ inputs.force_url }}
          FORCE_CATEGORY: ${{ inputs.force_category }}
          TRIGGER: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name || github.event_name == 'schedule' && 'hourly schedule' || 'manual' }}
        run: |
          args=(scan --site site --out task.json --brief-out "$RUNNER_TEMP/brief.json" --trigger "$TRIGGER")
          [ -n "$DRY" ] && args+=(--dry-run)
          [ -n "$FORCE_URL" ] && args+=(--force-url "$FORCE_URL" --force-category "${FORCE_CATEGORY:-launch}")
          node site/ops/radar/radar.mjs "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Park expired launches in the site backlog
        if: steps.scan.outputs.parks == 'true' && !inputs.dry_run
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q "$SITE_REMOTE" main && git checkout -q -f -B radar FETCH_HEAD || { sleep 10; continue; }
            node ops/radar/radar.mjs site-apply --site . --task ../task.json
            git add automation/backlog.md
            git diff --cached --quiet && break
            git commit -q -m "Radar: queue launches that missed the fast-track cap, trending stories and MSRC refresh lines"
            git push -q "$SITE_REMOTE" HEAD:main && break
            sleep 10
          done

      - name: News page lines (Claude)
        id: lines
        if: steps.scan.outputs.brief_pending == 'true' && !inputs.dry_run
        continue-on-error: true
        timeout-minutes: 6
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code --silent --no-audit --no-fund
          claude -p --model haiku --tools "" --max-turns 1 --output-format text \
            --system-prompt "$(cat site/ops/prompts/radar-lines-system.txt)" \
            < "$RUNNER_TEMP/brief.json.prompt.txt" > "$RUNNER_TEMP/brief-answer.txt"
          wc -c "$RUNNER_TEMP/brief-answer.txt"

      - name: News page lines (check and apply)
        if: steps.scan.outputs.brief_pending == 'true' && !inputs.dry_run
        run: node site/ops/radar/radar.mjs brief-apply --pending "$RUNNER_TEMP/brief.json" --answer "$RUNNER_TEMP/brief-answer.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Status snapshot and retirement calendar
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: |
          node site/ops/radar/status.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          node site/ops/radar/retirements.mjs --site site | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save radar state and log
        if: ${{ !inputs.dry_run }}
        run: |
          git add radar/state.json radar/log
          git add radar/status radar/retirements.json 2>/dev/null || true
          if [ -f radar/msrc.json ]; then git add radar/msrc.json; fi
          if [ -d radar/live ]; then git add radar/live; fi
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Radar scan $(TZ=Asia/Kolkata date '+%F %H:%M') IST"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done

      - name: Ping IndexNow for the news page
        if: steps.scan.outputs.brief_ping != '' && !inputs.dry_run
        continue-on-error: true
        env:
          URL: ${{ steps.scan.outputs.brief_ping }}
        run: |
          sleep 60
          node site/ops/radar/radar.mjs indexnow --url "$URL"

      - name: Start the device portal job
        if: steps.scan.outputs.devices_count != '' && !inputs.dry_run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.scan.outputs.devices_count }}
          FOCUS: ${{ steps.scan.outputs.devices_focus }}
        run: gh workflow run devices.yml --repo "$GITHUB_REPOSITORY" --ref main -f count="$COUNT" -f focus="$FOCUS" -f force=true

      - name: Start the writer
        if: steps.scan.outputs.kind != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dry_run && 'true' || 'false' }}
        run: gh workflow run radar.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=write -f dry_run="$DRY" -f task="$(cat task.json)"

  write:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'write'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: radar-write
      cancel-in-progress: false
    env:
      RADAR_DATA: ${{ github.workspace }}/_radar/radar
    steps:
      - name: Check Claude token
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "ready=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set."; exit 1; fi

      - uses: actions/checkout@v4
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}

      - uses: actions/checkout@v4
        with:
          ref: main
          path: _radar

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Task
        id: task
        env:
          TASK: ${{ inputs.task }}
        run: |
          printf '%s' "$TASK" > .radar-task.json
          printf '_radar/\n.radar-*\n.ops-*\n' >> .git/info/exclude
          node -e '
            const t = JSON.parse(require("fs").readFileSync(".radar-task.json", "utf8"));
            if (!["new", "update"].includes(t.kind) || !t.key || !t.link) { console.error("Bad task"); process.exit(1); }
            if (t.kind === "update" && !/^[a-z0-9-]+$/.test(t.slug ?? "")) { console.error("Update without a valid slug"); process.exit(1); }
            const category = ["incident", "outage", "patch-tuesday"].includes(t.category) ? t.category : "launch";
            const pt = /^[0-9]{4}-[0-9]{2}$/.test(t.patchTuesday ?? "") ? t.patchTuesday : "";
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `kind=${t.kind}\nkey=ok\nslug=${t.slug ?? ""}\ncategory=${category}\npatch_tuesday=${pt}\n`);
            console.log(`${t.kind} (${category}): ${t.title}\n${t.link}\nscore ${t.score}: ${(t.reasons ?? []).join("; ")}`);
          '
          echo "today=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      - name: Patch Tuesday data (MSRC CVRF + CISA KEV)
        if: steps.task.outputs.patch_tuesday != ''
        continue-on-error: true
        env:
          MONTH: ${{ steps.task.outputs.patch_tuesday }}
        run: node ops/radar/patch-tuesday.mjs summary --month "$MONTH" --out .radar-patch-tuesday.json

      - name: Prompt (attempt 1)
        env:
          KIND: ${{ steps.task.outputs.kind }}
          CATEGORY: ${{ steps.task.outputs.category }}
          TODAY: ${{ steps.task.outputs.today }}
        run: node ops/prompts/render.mjs ops/prompts/radar-write.md .ops-prompt.md

      - name: Write (Claude, attempt 1)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "*"
          claude_args: |
            --max-turns 150
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/check-posts.mjs:*),Bash(node ops/radar/radar.mjs check:*),Bash(ls:*),Bash(wc:*)"
          prompt: Your task for this run is in the file .ops-prompt.md in the repository root. Read it first and follow it exactly.

      - name: Find the article
        id: post
        env:
          KIND: ${{ steps.task.outputs.kind }}
          SLUG: ${{ steps.task.outputs.slug }}
        run: |
          git status --porcelain --untracked-files=all | awk '{print $2}' | grep -v '^content/posts/' | while read -r f; do
            echo "::warning::Reverting unexpected change: $f"
            git checkout -q -- "$f" 2>/dev/null || rm -f "$f"
          done
          if [ "$KIND" = "new" ]; then
            files=$(git status --porcelain --untracked-files=all content/posts | awk '/^\?\?/ {print $2}')
          else
            files=$(git status --porcelain content/posts | awk '{print $2}')
          fi
          count=$(printf '%s' "$files" | grep -c . || true)
          if [ "$count" = "0" ]; then echo "::notice::The writer wrote nothing (RADAR-SKIP)."; exit 0; fi
          if [ "$count" != "1" ]; then echo "::error::Expected one article, found $count: $files"; exit 1; fi
          if [ "$KIND" = "update" ] && [ "$files" != "content/posts/$SLUG.md" ]; then echo "::error::Update changed $files, expected $SLUG"; exit 1; fi
          slug=$(basename "$files" | sed -E 's/\.mdx?$//')
          echo "file=$files" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          node -e 'require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "title=" + require("gray-matter").read(process.argv[1]).data.title.replace(/\n/g, " ") + "\n")' "$files"

      - name: Quality gate (attempt 1)
        id: gate1
        if: steps.post.outputs.file != ''
        env:
          FILE: ${{ steps.post.outputs.file }}
          SLUG: ${{ steps.post.outputs.slug }}
          KIND: ${{ steps.task.outputs.kind }}
          CATEGORY: ${{ steps.task.outputs.category }}
          TODAY: ${{ steps.task.outputs.today }}
        run: |
          set +e
          { node scripts/check-posts.mjs "$SLUG" && node ops/radar/radar.mjs check --file "$FILE" --kind "$KIND" --today "$TODAY" --category "$CATEGORY"; } > .radar-gate.txt 2>&1
          rc=$?
          cat .radar-gate.txt
          if [ $rc = 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Prompt (attempt 2)
        if: steps.gate1.outputs.ok == 'false'
        env:
          FILE: ${{ steps.post.outputs.file }}
          KIND: ${{ steps.task.outputs.kind }}
          CATEGORY: ${{ steps.task.outputs.category }}
          TODAY: ${{ steps.task.outputs.today }}
        run: node ops/prompts/render.mjs ops/prompts/radar-fix.md .ops-prompt.md

      - name: Fix (Claude, attempt 2)
        if: steps.gate1.outputs.ok == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "*"
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/check-posts.mjs:*),Bash(node ops/radar/radar.mjs check:*),Bash(ls:*),Bash(wc:*)"
          prompt: Your task for this run is in the file .ops-prompt.md in the repository root. Read it first and follow it exactly.

      - name: Quality gate (attempt 2)
        id: gate2
        if: steps.gate1.outputs.ok == 'false'
        env:
          FILE: ${{ steps.post.outputs.file }}
          SLUG: ${{ steps.post.outputs.slug }}
          KIND: ${{ steps.task.outputs.kind }}
          CATEGORY: ${{ steps.task.outputs.category }}
          TODAY: ${{ steps.task.outputs.today }}
        run: |
          set +e
          { node scripts/check-posts.mjs "$SLUG" && node ops/radar/radar.mjs check --file "$FILE" --kind "$KIND" --today "$TODAY" --category "$CATEGORY"; } > .radar-gate.txt 2>&1
          rc=$?
          cat .radar-gate.txt
          if [ $rc = 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build
        id: build
        if: steps.gate1.outputs.ok == 'true' || steps.gate2.outputs.ok == 'true'
        continue-on-error: true
        run: npm run build

      - name: Verdict
        id: verdict
        env:
          FILE: ${{ steps.post.outputs.file }}
          PASSED: ${{ (steps.gate1.outputs.ok == 'true' || steps.gate2.outputs.ok == 'true') && steps.build.outcome == 'success' }}
        run: |
          if [ -z "$FILE" ]; then r=skipped; elif [ "$PASSED" = "true" ]; then r=published; else r=failed; fi
          echo "result=$r" >> "$GITHUB_OUTPUT"
          echo "Verdict: $r"

      - name: Upload the draft
        if: always() && steps.post.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ steps.post.outputs.slug }}
          path: |
            ${{ steps.post.outputs.file }}
            .radar-task.json
            .radar-gate.txt
          include-hidden-files: true
          retention-days: 30

      - name: Publish (or park a failed draft in the backlog)
        id: publish
        if: ${{ !inputs.dry_run && (steps.verdict.outputs.result == 'published' || (steps.verdict.outputs.result == 'failed' && steps.task.outputs.kind == 'new')) }}
        env:
          RESULT: ${{ steps.verdict.outputs.result }}
          FILE: ${{ steps.post.outputs.file }}
          SLUG: ${{ steps.post.outputs.slug }}
          KIND: ${{ steps.task.outputs.kind }}
          TITLE: ${{ steps.post.outputs.title }}
          TODAY: ${{ steps.task.outputs.today }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$FILE" "$RUNNER_TEMP/post.md"
          if [ "$RESULT" = "published" ]; then
            [ "$KIND" = "update" ] && msg="Update article: $TITLE" || msg="Add fast-track article: $TITLE"
          else
            msg="Radar: park $SLUG (fast-track, failed gate)"
          fi
          done=""
          for i in 1 2 3 4; do
            git fetch -q "$SITE_REMOTE" main && git checkout -q -f -B radar-pub FETCH_HEAD || { sleep 10; continue; }
            if [ "$RESULT" = "published" ]; then
              cp "$RUNNER_TEMP/post.md" "$FILE"
              node ops/radar/radar.mjs site-apply --site . --task .radar-task.json --result published --file "$FILE" --date "$TODAY"
              git add "$FILE" automation/backlog.md automation/log.md
            else
              rm -f "$FILE"
              node ops/radar/radar.mjs site-apply --site . --task .radar-task.json --result failed --slug "$SLUG" --date "$TODAY"
              git add automation/backlog.md
            fi
            git diff --cached --quiet && { done=1; break; }
            git commit -q -m "$msg" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
            git push -q "$SITE_REMOTE" HEAD:main && { done=1; break; }
            sleep 10
          done
          [ -n "$done" ] || { echo "::error::Could not push to the site repo"; exit 1; }

      - name: Ping IndexNow
        if: ${{ !inputs.dry_run && steps.verdict.outputs.result == 'published' && steps.publish.outcome == 'success' }}
        env:
          URL: https://www.epifive.com/blog/${{ steps.post.outputs.slug }}
          KIND: ${{ steps.task.outputs.kind }}
          TODAY: ${{ steps.task.outputs.today }}
        run: |
          for i in $(seq 1 40); do
            if [ "$KIND" = "update" ]; then curl -s "$URL" | grep -q "Updated $TODAY" && break
            else [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL")" = "200" ] && break; fi
            sleep 20
          done
          node scripts/seo/indexnow.mjs "$URL"

      - name: Ping WebSub (feeds)
        if: ${{ !cancelled() && !inputs.dry_run && steps.verdict.outputs.result == 'published' && steps.publish.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/seo/websub.mjs || true

      - name: Email alert
        if: steps.verdict.outputs.result == 'published' && (inputs.dry_run || steps.publish.outcome == 'success') && (steps.task.outputs.category == 'outage' || steps.task.outputs.category == 'incident' || steps.task.outputs.category == 'patch-tuesday')
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_POSTAL_ADDRESS: ${{ secrets.ALERT_POSTAL_ADDRESS }}
          DRY: ${{ inputs.dry_run && 'true' || 'false' }}
          FILE: ${{ steps.post.outputs.file }}
        run: |
          args=(alert --site . --task .radar-task.json --status published --file "$FILE")
          [ "$DRY" = true ] && args+=(--dry-run)
          node ops/radar/radar.mjs "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Trending Short and long video
        id: videos
        if: steps.verdict.outputs.result == 'published' && (inputs.dry_run || steps.publish.outcome == 'success')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dry_run && 'true' || 'false' }}
          FILE: ${{ steps.post.outputs.file }}
        run: |
          plan=$(node ops/radar/radar.mjs video-plan --site . --task .radar-task.json --status published --file "$FILE")
          echo "$plan"
          get() { node -e 'const v = JSON.parse(process.argv[1])[process.argv[2]]; process.stdout.write(v == null ? "" : String(v))' "$plan" "$1"; }
          if [ "$(get dispatch)" != true ]; then
            echo "Trending videos: none ($(get reason))." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          start() {
            if [ "$DRY" = true ]; then echo "[dry run] gh workflow run $*"; else gh workflow run "$@" --repo "$GITHUB_REPOSITORY" --ref main; fi
          }
          slug=$(get slug)
          start social.yml -f slug="$slug" -f force=true -f brief="$(get brief)"
          [ "$DRY" = true ] || echo "day=$(get day)" >> "$GITHUB_OUTPUT"
          if [ "$(get long)" = true ]; then
            start longvideo.yml -f mode=video -f slug="$slug" -f force=true -f publish_now=true -f upload=true
            long="long video public at once"
            [ "$(get replacesDaily)" = true ] && long="$long (replaces today's daily long video if it starts first)"
          else
            long="no long video: $(get longSkipped)"
          fi
          echo "Trending videos for $slug ($(get reason)): Short + $long.$([ "$DRY" = true ] && echo ' Dry run: nothing started.')" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record the outcome
        if: always() && steps.task.outputs.key == 'ok' && !inputs.dry_run
        working-directory: _radar
        env:
          RESULT: ${{ steps.verdict.outputs.result }}
          PUBLISHED: ${{ steps.publish.outcome }}
          SLUG: ${{ steps.post.outputs.slug }}
          TITLE: ${{ steps.post.outputs.title }}
          AUTO_VIDEO: ${{ steps.videos.outputs.day }}
        run: |
          status="${RESULT:-error}"
          if [ "$status" = "published" ] && [ "$PUBLISHED" != "success" ]; then status=error; fi
          args=(record --task ../.radar-task.json --status "$status")
          [ -n "$AUTO_VIDEO" ] && args+=(--auto-video "$AUTO_VIDEO")
          [ -n "$SLUG" ] && args+=(--slug "$SLUG")
          [ -n "$TITLE" ] && args+=(--title "$TITLE")
          if [ "$status" = "skipped" ] && [ -f ../.radar-skip.txt ]; then args+=(--reason "$(head -c 300 ../.radar-skip.txt | tr '\r\n' '  ')"); fi
          node ../ops/radar/radar.mjs "${args[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar/results.jsonl
          git commit -q -m "Radar result: $status ${SLUG:-}"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done

      - name: Summary
        if: always()
        env:
          TITLE: ${{ steps.post.outputs.title }}
          SLUG: ${{ steps.post.outputs.slug }}
          FILE: ${{ steps.post.outputs.file }}
          RESULT: ${{ steps.verdict.outputs.result }}
          DRY: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Launch radar: ${RESULT:-error}"
            echo
            [ -n "$TITLE" ] && echo "**$TITLE**" && echo && echo "https://www.epifive.com/blog/$SLUG"
            [ -n "$FILE" ] && [ -f "$FILE" ] && echo && echo "Words (including code): $(sed '1,/^---$/d' "$FILE" | wc -w)"
            [ -n "$FILE" ] && [ -f "$FILE" ] && echo && echo '### Outline' && grep -E '^##+ ' "$FILE"
            [ -f .radar-gate.txt ] && echo && echo '### Gate' && echo '```text' && cat .radar-gate.txt && echo '```'
            [ "$DRY" = "true" ] && echo && echo "_Dry run: nothing was published._"
            true # the last test above is false on real runs; without this the step (and the run) showed "failed"
          } >> "$GITHUB_STEP_SUMMARY"
