# Daily article. Code, prompts and notes live in the private repo (ops/; annotated copy: ops/docs/workflow-notes/article.yml).
name: Daily article

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Write and check the article but do not publish it
        type: boolean
        default: false
      mode:
        description: Job to run (auto = next one due today)
        type: choice
        options: [auto, article, errors, refresh, interlink, interlink-full]
        default: auto

env:
  SITE_REMOTE: https://x-access-token:${{ secrets.SITE_REPO_TOKEN }}@github.com/sk9836413/EPIVIFE.git

permissions:
  contents: write
  id-token: write
  actions: write # the chain step below starts the next article of the day

concurrency:
  group: article
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check Claude token
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "ready=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then echo "::notice::CLAUDE_CODE_OAUTH_TOKEN secret is not set; skipping."; fi

      - uses: actions/checkout@v4
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Today's date and job
        id: date
        if: steps.gate.outputs.ready == 'true'
        env:
          WANT: ${{ inputs.mode || 'auto' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          MAX: ${{ vars.ARTICLES_PER_DAY || '1' }}
          RMAX: ${{ vars.REFRESH_PER_DAY || '2' }}
          EMAX: ${{ vars.ERRORS_PER_DAY || '5' }}
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          n=$(grep -c "^$today | .* | published |" automation/log.md || true)
          r=$(grep -cE "^$today \| [a-z0-9-]+ \| refresh(ed|-failed) \|" automation/log.md || true)
          il=$(grep -c "^$today | interlink |" automation/log.md || true)
          open=$(node scripts/seo/refresh-queue.mjs next | grep -c . || true)
          er=$(grep -c "^$today | errors |" automation/log.md || true)
          eq=0
          [ -f scripts/error-queue.mjs ] && eq=$(node scripts/error-queue.mjs next 1 | grep -c . || true)
          full=false
          [ "$(TZ=Asia/Kolkata date +%u)" = "1" ] && full=true
          case "$WANT" in
            article|errors|refresh|interlink) mode="$WANT" ;;
            interlink-full) mode=interlink; full=true ;;
            *)
              if [ "$DRY_RUN" = "true" ] || [ "${n:-0}" -lt "$MAX" ]; then mode=article
              elif [ "${EMAX:-0}" -gt 0 ] && [ "${er:-0}" -eq 0 ] && [ "${eq:-0}" -gt 0 ]; then mode=errors
              elif [ "${r:-0}" -lt "$RMAX" ] && [ "${open:-0}" -gt 0 ]; then mode=refresh
              elif [ "${il:-0}" -eq 0 ]; then mode=interlink
              else mode=none
              fi ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "::notice::$today: $n/$MAX articles, error lane ${er:-0}/1 ($EMAX codes a run, ${eq:-0} open), ${r:-0}/$RMAX refreshes ($open in the queue), interlink ${il:-0}/1 -> $mode"

      - name: Prompt for Research and write (Claude)
        if: steps.gate.outputs.ready == 'true' && steps.date.outputs.mode == 'article'
        env:
          TODAY: ${{steps.date.outputs.today}}
        run: |
          if [ -d .git ]; then grep -qx '.ops-\*' .git/info/exclude || printf '.ops-*\n' >> .git/info/exclude; fi
          node ops/prompts/render.mjs ops/prompts/article-research-and-write-claude.md .ops-prompt.md

      - name: Research and write (Claude)
        if: steps.gate.outputs.ready == 'true' && steps.date.outputs.mode == 'article'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 150
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/check-posts.mjs:*),Bash(ls:*),Bash(wc:*)"
          prompt: Your task for this run is in the file .ops-prompt.md in the repository root. Read it first and follow it exactly.

      - name: Find the new article
        id: post
        if: steps.gate.outputs.ready == 'true' && steps.date.outputs.mode == 'article'
        run: |
          new=$(git status --porcelain --untracked-files=all content/posts | awk '/^\?\?/ {print $2}')
          count=$(printf '%s' "$new" | grep -c . || true)
          if [ "$count" != "1" ]; then
            [ "$count" = "0" ] && echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "::error::Expected exactly one new post, found $count: $new"
            git status --short
            exit 1
          fi
          slug=$(basename "$new" | sed -E 's/\.mdx?$//')
          title=$(node -e "console.log(require('gray-matter').read('$new').data.title)")
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "file=$new" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "New article: $slug"

      - name: Quality gate
        if: steps.post.outputs.slug != ''
        run: node scripts/check-posts.mjs "${{ steps.post.outputs.slug }}"

      - name: Google drip (release held posts to Google)
        id: drip
        if: steps.post.outputs.slug != '' && !inputs.dry_run
        continue-on-error: true
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          node scripts/seo/google-drip.mjs release --new "${{ steps.post.outputs.slug }}" --files-out "$RUNNER_TEMP/drip-files" | tee "$RUNNER_TEMP/drip.json"
          if [ -s "$RUNNER_TEMP/drip-files" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "url=$(node -e "console.log(require(process.argv[1]).released[0]?.url ?? '')" "$RUNNER_TEMP/drip.json")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.post.outputs.slug != ''
        run: npm run build

      - name: Publish
        id: publish
        if: steps.post.outputs.slug != '' && !inputs.dry_run
        env:
          FILE: ${{ steps.post.outputs.file }}
          TITLE: ${{ steps.post.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE" automation/backlog.md automation/log.md
          drip=""
          if [ -s "$RUNNER_TEMP/drip-files" ]; then
            xargs git add -- < "$RUNNER_TEMP/drip-files"
            drip="Google drip: released $(grep -c '^content/posts/' "$RUNNER_TEMP/drip-files") held post(s) to Google."
          fi
          git commit -q -m "Add article: $TITLE" ${drip:+-m "$drip"} -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          for i in 1 2 3; do git pull -q --rebase "$SITE_REMOTE" main && git push -q "$SITE_REMOTE" HEAD:main && break; sleep 10; done
          echo "chain=true" >> "$GITHUB_OUTPUT"

      - name: Ping IndexNow
        if: steps.post.outputs.slug != '' && !inputs.dry_run
        env:
          URL: https://www.epifive.com/blog/${{ steps.post.outputs.slug }}
        run: |
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL")" = "200" ] && break
            sleep 20
          done
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"www.epifive.com\",\"key\":\"5bbd01230376e7468f09aef0ef85403c\",\"keyLocation\":\"https://www.epifive.com/5bbd01230376e7468f09aef0ef85403c.txt\",\"urlList\":[\"$URL\"]}" \
            -w '\nHTTP %{http_code}\n'

      - name: Re-submit the Google sitemap
        if: steps.drip.outputs.released == 'true' && !inputs.dry_run
        continue-on-error: true
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
          URL: ${{ steps.drip.outputs.url }}
        run: |
          if [ -n "$URL" ] && curl -s "$URL" | grep -q 'name="googlebot" content="noindex'; then
            echo "::warning::$URL still has the googlebot noindex (deploy not live yet?); submitting the sitemap anyway."
          fi
          node scripts/seo/gsc.mjs submit-sitemap

      - name: Ping WebSub (feeds)
        if: ${{ !cancelled() && steps.publish.outputs.chain == 'true' && !inputs.dry_run }}
        continue-on-error: true
        env:
          URL: https://www.epifive.com/blog/${{ steps.post.outputs.slug }}
        run: node scripts/seo/websub.mjs --expect "$URL" || true

      - name: Summary
        if: always() && steps.post.outputs.slug != ''
        run: |
          {
            echo "## ${{ steps.post.outputs.title }}"
            echo
            echo "https://www.epifive.com/blog/${{ steps.post.outputs.slug }}"
            echo
            echo "Words (including code): $(sed '1,/^---$/d' "${{ steps.post.outputs.file }}" | wc -w)"
            if [ "${{ inputs.dry_run }}" = "true" ]; then echo; echo "_Dry run: not published._"; fi
            if [ -s "$RUNNER_TEMP/drip.json" ]; then echo; echo "Google drip:"; echo '```json'; cat "$RUNNER_TEMP/drip.json"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the article
        if: always() && steps.post.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: article-${{ steps.post.outputs.slug }}
          path: |
            ${{ steps.post.outputs.file }}
            automation/backlog.md
            automation/log.md
          retention-days: 30

      - name: Pick the error codes
        id: epick
        if: steps.gate.outputs.ready == 'true' && steps.date.outputs.mode == 'errors'
        env:
          EMAX: ${{ vars.ERRORS_PER_DAY || '5' }}
        run: |
          node scripts/error-queue.mjs next $(( EMAX * 2 )) > "$RUNNER_TEMP/errors-pick.tsv"
          n=$(grep -c . "$RUNNER_TEMP/errors-pick.tsv" || true)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "max=$EMAX" >> "$GITHUB_OUTPUT"
          { echo 'list<<EOF_ERROR_PICK'; awk -F'\t' '{printf "%d. %s | %s | %s | %s\n", NR, $1, $2, $3, $4}' "$RUNNER_TEMP/errors-pick.tsv"; echo 'EOF_ERROR_PICK'; } >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/errors-pick.tsv"

      - name: Prompt for Write the error pages (Claude)
        if: steps.epick.outputs.count != '' && steps.epick.outputs.count != '0'
        env:
          TODAY: ${{steps.date.outputs.today}}
          LIST: ${{steps.epick.outputs.list}}
          MAX: ${{steps.epick.outputs.max}}
        run: |
          if [ -d .git ]; then grep -qx '.ops-\*' .git/info/exclude || printf '.ops-*\n' >> .git/info/exclude; fi
          node ops/prompts/render.mjs ops/prompts/article-write-the-error-pages-claude.md .ops-prompt.md

      - name: Write the error pages (Claude)
        id: ewrite
        if: steps.epick.outputs.count != '' && steps.epick.outputs.count != '0'
        continue-on-error: true # whatever passes the gate below is still published
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 220
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/error-source.mjs:*),Bash(node scripts/check-errors.mjs:*),Bash(ls:*),Bash(wc:*)"
          prompt: Your task for this run is in the file .ops-prompt.md in the repository root. Read it first and follow it exactly.

      - name: Gate the error pages
        id: egate
        if: steps.epick.outputs.count != '' && steps.epick.outputs.count != '0'
        env:
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          set -u
          skipped="$RUNNER_TEMP/errors-skipped.tsv"
          touch .errors-skipped.tsv
          tr -d '\r' < .errors-skipped.tsv > "$skipped"
          rm -f .errors-skipped.tsv
          git diff --name-only | while read -r f; do echo "::warning::Reverting an edit outside the lane: $f"; git checkout -- "$f"; done
          { git ls-files --others --exclude-standard | grep -Ev '^content/errors/[a-z0-9-]+/[a-z0-9-]+\.md$' || true; } | while read -r f; do
            echo "::warning::Removing a file outside the lane: $f"; rm -f -- "$f"
          done
          new() { git ls-files --others --exclude-standard -- content/errors | grep -E '^content/errors/[a-z0-9-]+/[a-z0-9-]+\.md$' || true; }
          drop() { # file reason
            local id; id=$(printf '%s' "$1" | sed -E 's#^content/errors/##; s#\.md$##')
            code=$(node -e "console.log(require('gray-matter').read(process.argv[1]).data.code ?? '')" "$1" 2>/dev/null || true)
            printf '%s\t%s\t%s\n' "${id%%/*}" "${code:-${id#*/}}" "$2" >> "$skipped"
            echo "::warning::Not published: $id ($2)"
            rm -f -- "$1"
          }
          for f in $(new); do
            id=$(printf '%s' "$f" | sed -E 's#^content/errors/##; s#\.md$##')
            node scripts/check-errors.mjs "$id" --online --strict || drop "$f" "failed check-errors --online --strict"
          done
          for pass in 1 2 3; do
            out=$(node scripts/check-errors.mjs 2>&1) && break
            echo "$out"
            for f in $(new); do
              if printf '%s' "$out" | grep -qF "$f"; then drop "$f" "failed the library check"; fi
            done
          done
          node scripts/check-errors.mjs
          added=$(new | tr '\n' ' ')
          echo "added=$added" >> "$GITHUB_OUTPUT"
          echo "count=$(new | grep -c . || true)" >> "$GITHUB_OUTPUT"
          for f in $(new); do
            code=$(node -e "console.log(require('gray-matter').read(process.argv[1]).data.code)" "$f")
            product=$(printf '%s' "$f" | cut -d/ -f3)
            node scripts/error-queue.mjs mark "$product" "$code" added "$TODAY"
          done
          sk=0
          while IFS=$'\t' read -r product code reason; do
            [ -n "${product:-}" ] && [ -n "${code:-}" ] || continue
            node scripts/error-queue.mjs mark "$product" "$code" skipped "$TODAY" "${reason:-skipped by the writer}"
            sk=$((sk + 1))
          done < "$skipped"
          echo "skipped=$sk" >> "$GITHUB_OUTPUT"
          git status --short

      - name: Build (error pages)
        id: ebuild
        if: steps.egate.outputs.count != '' && steps.egate.outputs.count != '0'
        run: npm run build

      - name: Publish the error pages
        id: epublish
        if: steps.egate.outcome == 'success' && !inputs.dry_run
        env:
          TODAY: ${{ steps.date.outputs.today }}
          ADDED: ${{ steps.egate.outputs.added }}
          COUNT: ${{ steps.egate.outputs.count }}
          SKIPPED: ${{ steps.egate.outputs.skipped }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ids=$(for f in $ADDED; do printf '%s ' "$(printf '%s' "$f" | sed -E 's#^content/errors/##; s#\.md$##')"; done)
          [ -z "$(tail -c1 automation/log.md)" ] || echo >> automation/log.md
          echo "$TODAY | errors | added | ${COUNT:-0} codes: ${ids:-none}; skipped ${SKIPPED:-0}" >> automation/log.md
          git add content/errors automation/log.md
          git commit -q -m "Error library: ${COUNT:-0} new codes (daily lane)" -m "${ids:-No page passed today; queue lines marked.}" -m "Each page passed check-errors --online --strict (official source fetched, verbatim quote found). Skipped: ${SKIPPED:-0}." -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          ok=""
          for i in 1 2 3; do if git pull -q --rebase "$SITE_REMOTE" main && git push -q "$SITE_REMOTE" HEAD:main; then ok=1; break; fi; sleep 10; done
          [ -n "$ok" ] || { echo "::error::Push failed"; exit 1; }
          echo "chain=true" >> "$GITHUB_OUTPUT"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          {
            echo "## Error library: ${COUNT:-0} new codes, ${SKIPPED:-0} skipped"
            for id in $ids; do echo "- https://www.epifive.com/errors/$id"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log a failed error run
        id: edefer
        if: failure() && steps.epick.outputs.count != '' && steps.epick.outputs.count != '0' && steps.epublish.outputs.chain != 'true' && !inputs.dry_run
        env:
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q "$SITE_REMOTE" main && git reset -q --hard FETCH_HEAD
          git clean -fdq -- content automation
          rm -f .errors-skipped.tsv
          [ -z "$(tail -c1 automation/log.md)" ] || echo >> automation/log.md
          echo "$TODAY | errors | failed | run failed (see the workflow log); nothing published" >> automation/log.md
          git add automation/log.md
          git commit -q -m "Error lane: run failed on $TODAY, nothing published" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          ok=""
          for i in 1 2 3; do if git pull -q --rebase "$SITE_REMOTE" main && git push -q "$SITE_REMOTE" HEAD:main; then ok=1; break; fi; sleep 10; done
          [ -n "$ok" ] && echo "chain=true" >> "$GITHUB_OUTPUT"

      - name: Ping IndexNow (error pages)
        if: steps.epublish.outputs.ids != '' && !inputs.dry_run
        continue-on-error: true
        env:
          IDS: ${{ steps.epublish.outputs.ids }}
        run: |
          first=$(printf '%s' "$IDS" | awk '{print $1}')
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "https://www.epifive.com/errors/$first")" = "200" ] && break
            sleep 20
          done
          urls=(https://www.epifive.com/errors)
          for id in $IDS; do urls+=("https://www.epifive.com/errors/$id"); done
          node scripts/seo/indexnow.mjs "${urls[@]}"

      - name: Pick the refresh
        id: rpick
        if: steps.gate.outputs.ready == 'true' && steps.date.outputs.mode == 'refresh'
        run: |
          next=$(node scripts/seo/refresh-queue.mjs next)
          slug=$(printf '%s' "$next" | cut -f1)
          if [ -z "$slug" ]; then echo "::notice::No open refresh line with an existing post."; exit 0; fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "file=content/posts/$slug.md" >> "$GITHUB_OUTPUT"
          { echo 'line<<EOF_REFRESH_LINE'; printf '%s\n' "$next" | cut -f2-; echo 'EOF_REFRESH_LINE'; } >> "$GITHUB_OUTPUT"
          echo "Refresh: $slug"

      - name: Prompt for Refresh the post (Claude)
        if: steps.rpick.outputs.slug != ''
        env:
          TODAY: ${{steps.date.outputs.today}}
          SLUG: ${{steps.rpick.outputs.slug}}
          LINE: ${{steps.rpick.outputs.line}}
        run: |
          if [ -d .git ]; then grep -qx '.ops-\*' .git/info/exclude || printf '.ops-*\n' >> .git/info/exclude; fi
          node ops/prompts/render.mjs ops/prompts/article-refresh-the-post-claude.md .ops-prompt.md

      - name: Refresh the post (Claude)
        if: steps.rpick.outputs.slug != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 120
            --allowedTools "Read,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/check-posts.mjs:*),Bash(ls:*),Bash(wc:*)"
          prompt: Your task for this run is in the file .ops-prompt.md in the repository root. Read it first and follow it exactly.

      - name: Check the refresh
        id: refreshed
        if: steps.rpick.outputs.slug != ''
        env:
          SLUG: ${{ steps.rpick.outputs.slug }}
          FILE: ${{ steps.rpick.outputs.file }}
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          changed=$(git status --porcelain --untracked-files=all -- content automation src public scripts | awk '{print $2}')
          if [ "$changed" != "$FILE" ]; then
            echo "::error::Expected only $FILE to change, found: ${changed:-nothing}"
            git status --short
            exit 1
          fi
          grep -Eq "^updated: '?$TODAY'?\s*$" "$FILE" || echo "::warning::$FILE does not say updated: '$TODAY'"
          node scripts/check-posts.mjs "$SLUG"
          echo "title=$(node -e "console.log(require('gray-matter').read(process.argv[1]).data.title)" "$FILE")" >> "$GITHUB_OUTPUT"
          echo "words=$(sed '1,/^---$/d' "$FILE" | wc -w)" >> "$GITHUB_OUTPUT"
          git diff --stat

      - name: Build (refresh)
        if: steps.refreshed.outputs.title != ''
        run: npm run build

      - name: Publish the refresh
        id: rpublish
        if: steps.refreshed.outputs.title != '' && !inputs.dry_run
        env:
          SLUG: ${{ steps.rpick.outputs.slug }}
          FILE: ${{ steps.rpick.outputs.file }}
          TITLE: ${{ steps.refreshed.outputs.title }}
          WORDS: ${{ steps.refreshed.outputs.words }}
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/seo/refresh-queue.mjs tick "$SLUG" "$TODAY"
          [ -z "$(tail -c1 automation/log.md)" ] || echo >> automation/log.md
          echo "$TODAY | $SLUG | refreshed | ~$WORDS words" >> automation/log.md
          git add "$FILE" automation/backlog.md automation/log.md
          git commit -q -m "Refresh article: $TITLE" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          ok=""
          for i in 1 2 3; do if git pull -q --rebase "$SITE_REMOTE" main && git push -q "$SITE_REMOTE" HEAD:main; then ok=1; break; fi; sleep 10; done
          [ -n "$ok" ] || { echo "::error::Push failed"; exit 1; }
          echo "chain=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Refreshed: $TITLE"
            echo
            echo "https://www.epifive.com/blog/$SLUG ($WORDS words including code)"
          } >> "$GITHUB_STEP_SUMMARY"
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"www.epifive.com\",\"key\":\"5bbd01230376e7468f09aef0ef85403c\",\"keyLocation\":\"https://www.epifive.com/5bbd01230376e7468f09aef0ef85403c.txt\",\"urlList\":[\"https://www.epifive.com/blog/$SLUG\"]}" \
            -w '\nIndexNow HTTP %{http_code}\n' || true

      - name: Ping WebSub (refresh)
        if: ${{ !cancelled() && steps.rpublish.outputs.chain == 'true' && !inputs.dry_run }}
        continue-on-error: true
        env:
          URL: https://www.epifive.com/blog/${{ steps.rpick.outputs.slug }}
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          day=$(date -u -d "$TODAY" '+%d %b %Y')
          for i in $(seq 1 30); do
            curl -s "https://www.epifive.com/feed-updates.xml" | grep -A3 "<link>$URL</link>" | grep -q "$day" && break
            sleep 20
          done
          node scripts/seo/websub.mjs || true

      - name: Defer a failed refresh
        id: rdefer
        if: failure() && steps.rpick.outputs.slug != '' && steps.rpublish.outputs.chain != 'true' && !inputs.dry_run
        env:
          SLUG: ${{ steps.rpick.outputs.slug }}
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q "$SITE_REMOTE" main && git reset -q --hard FETCH_HEAD
          git clean -fdq -- content automation
          node scripts/seo/refresh-queue.mjs defer "$SLUG" "$TODAY: refresh run failed"
          [ -z "$(tail -c1 automation/log.md)" ] || echo >> automation/log.md
          echo "$TODAY | $SLUG | refresh-failed | deferred to the end of the queue" >> automation/log.md
          git add automation/backlog.md automation/log.md
          git commit -q -m "Refresh queue: defer $SLUG (run failed)" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          ok=""
          for i in 1 2 3; do if git pull -q --rebase "$SITE_REMOTE" main && git push -q "$SITE_REMOTE" HEAD:main; then ok=1; break; fi; sleep 10; done
          [ -n "$ok" ] && echo "chain=true" >> "$GITHUB_OUTPUT"

      - name: Search Console striking-distance block (Mondays)
        id: gscblock
        if: steps.gate.outputs.ready == 'true' && steps.date.outputs.mode == 'interlink' && steps.date.outputs.full == 'true'
        continue-on-error: true
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then node scripts/seo/refresh-queue.mjs gsc > "$RUNNER_TEMP/gsc.json"
          else node scripts/seo/refresh-queue.mjs gsc --write > "$RUNNER_TEMP/gsc.json"; fi
          n=$(node -e "console.log(require(process.argv[1]).picks.length)" "$RUNNER_TEMP/gsc.json")
          echo "picks=$n" >> "$GITHUB_OUTPUT"
          { echo "### Search Console refresh block: $n post(s)"; echo '```json'; cat "$RUNNER_TEMP/gsc.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Internal links
        id: links
        if: steps.gate.outputs.ready == 'true' && steps.date.outputs.mode == 'interlink'
        env:
          FULL: ${{ steps.date.outputs.full }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=(--report "$RUNNER_TEMP/interlink.json")
          [ "$FULL" = "true" ] || args+=(--max-files 40)
          [ "$DRY_RUN" = "true" ] || args+=(--write)
          node scripts/seo/interlink.mjs "${args[@]}" > "$RUNNER_TEMP/interlink-summary.json"
          cat "$RUNNER_TEMP/interlink-summary.json"
          echo "posts=$(git status --porcelain -- content/posts | grep -c . || true)" >> "$GITHUB_OUTPUT"
          echo "links=$(node -e "console.log(require(process.argv[1]).linksInSelection)" "$RUNNER_TEMP/interlink-summary.json")" >> "$GITHUB_OUTPUT"
          { echo "### Internal links (full pass: $FULL)"; echo '```json'; cat "$RUNNER_TEMP/interlink-summary.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Quality gate and build (internal links)
        if: steps.links.outcome == 'success' && steps.links.outputs.posts != '0'
        run: |
          node scripts/check-posts.mjs
          npm run build

      - name: Publish internal links
        id: lpublish
        if: steps.links.outcome == 'success' && !inputs.dry_run
        env:
          TODAY: ${{ steps.date.outputs.today }}
          POSTS: ${{ steps.links.outputs.posts }}
          LINKS: ${{ steps.links.outputs.links }}
          FULL: ${{ steps.date.outputs.full }}
          GSC: ${{ steps.gscblock.outputs.picks }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          note="$LINKS links in $POSTS posts"
          [ "$FULL" = "true" ] && note="$note, full pass"
          [ -n "$GSC" ] && note="$note, Search Console refresh block: $GSC posts"
          [ -z "$(tail -c1 automation/log.md)" ] || echo >> automation/log.md
          echo "$TODAY | interlink | links | $note" >> automation/log.md
          git add content/posts automation/backlog.md automation/log.md
          git commit -q -m "Internal links: $note" -m "scripts/seo/interlink.mjs (See also lists, orphans first) run by the Daily article workflow." -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          ok=""
          for i in 1 2 3; do if git pull -q --rebase "$SITE_REMOTE" main && git push -q "$SITE_REMOTE" HEAD:main; then ok=1; break; fi; sleep 10; done
          [ -n "$ok" ] || { echo "::error::Push failed"; exit 1; }
          echo "chain=true" >> "$GITHUB_OUTPUT"

      - name: Upload the internal-links report
        if: always() && steps.links.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: interlink-${{ steps.date.outputs.today }}
          path: ${{ runner.temp }}/interlink.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Defer a backlog line the writer gave up on
        id: adefer
        if: failure() && steps.post.outputs.empty == 'true' && !inputs.dry_run
        env:
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q "$SITE_REMOTE" main && git reset -q --hard FETCH_HEAD
          git clean -fdq -- content automation
          slug=$(node ops/article/defer-top.mjs "$TODAY")
          [ -n "$slug" ] || exit 0
          [ -z "$(tail -c1 automation/log.md)" ] || echo >> automation/log.md
          echo "$TODAY | $slug | no-post | deferred to the end of its section" >> automation/log.md
          git add automation/backlog.md automation/log.md
          git commit -q -m "Backlog: defer $slug (writer finished without a post)" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          ok=""
          for i in 1 2 3; do if git pull -q --rebase "$SITE_REMOTE" main && git push -q "$SITE_REMOTE" HEAD:main; then ok=1; break; fi; sleep 10; done
          [ -n "$ok" ] && echo "chain=true" >> "$GITHUB_OUTPUT"

      - name: Next job of the day
        if: always() && !inputs.dry_run && (steps.publish.outputs.chain == 'true' || steps.epublish.outputs.chain == 'true' || steps.edefer.outputs.chain == 'true' || steps.rpublish.outputs.chain == 'true' || steps.rdefer.outputs.chain == 'true' || steps.lpublish.outputs.chain == 'true' || steps.adefer.outputs.chain == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          MAX: ${{ vars.ARTICLES_PER_DAY || '1' }}
          RMAX: ${{ vars.REFRESH_PER_DAY || '2' }}
          EMAX: ${{ vars.ERRORS_PER_DAY || '5' }}
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          n=$(grep -c "^$today | .* | published |" automation/log.md || true)
          er=$(grep -c "^$today | errors |" automation/log.md || true)
          eq=0
          [ -f scripts/error-queue.mjs ] && eq=$(node scripts/error-queue.mjs next 1 | grep -c . || true)
          edue=false
          [ "${EMAX:-0}" -gt 0 ] && [ "${er:-0}" -eq 0 ] && [ "${eq:-0}" -gt 0 ] && edue=true
          r=$(grep -cE "^$today \| [a-z0-9-]+ \| refresh(ed|-failed) \|" automation/log.md || true)
          il=$(grep -c "^$today | interlink |" automation/log.md || true)
          open=$(node scripts/seo/refresh-queue.mjs next | grep -c . || true)
          if [ "${n:-0}" -lt "$MAX" ] || [ "$edue" = "true" ] || { [ "${r:-0}" -lt "$RMAX" ] && [ "${open:-0}" -gt 0 ]; } || [ "${il:-0}" -eq 0 ]; then
            gh workflow run article.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "::notice::Today: $n/$MAX articles, error lane ${er:-0}/1, ${r:-0}/$RMAX refreshes, interlink ${il:-0}/1: started the next run."
          else
            echo "::notice::Today: $n/$MAX articles, ${r:-0}/$RMAX refreshes, interlink done: finished for the day."
          fi
