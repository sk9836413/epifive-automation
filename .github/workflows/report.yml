# Daily performance report. Code, prompts and notes live in the private repo (ops/; annotated copy: ops/docs/workflow-notes/report.yml).
name: Daily performance report

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the email text (private lines masked) and send nothing
        type: boolean
        default: false
      date:
        description: IST date to report (YYYY-MM-DD). Empty = today.
        type: string
        default: ''
      force:
        description: Send again even if today's report was already sent
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check out the code (private repo, ops/)
        uses: actions/checkout@v4
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: _ops
          persist-credentials: false
          sparse-checkout: |
            ops/report
            scripts/stats

      - name: Check out Shyam's day plan
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: sk9836413/shyam-premi-sn
          path: .shyam
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /automation/
            /story/movies/
            /music/library/*.licence.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tests
        run: node --test _ops/ops/report/report.test.mjs

      - name: Build and send
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE: ${{ inputs.force && '1' || '' }}
          REPORT_DATE: ${{ inputs.date }}
          REPORT_FROM: EpiFive Report <hello@epifive.com>
          REPORT_TO: info@epifive.com
          REPORT_BCC: epifive2@gmail.com
          SHYAM_DIR: ${{ github.workspace }}/.shyam
          AUTOMATION_DATA: ${{ github.workspace }}
          CRM_URL: ${{ vars.CRM_URL || 'https://epifive-crm.pages.dev' }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Mondays: search and AI visibility (EPIVIFE scripts/stats/visibility.mjs, owner 27 Nov 2026).
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SHYAM_YT_CLIENT_ID: ${{ secrets.SHYAM_YT_CLIENT_ID }}
          SHYAM_YT_CLIENT_SECRET: ${{ secrets.SHYAM_YT_CLIENT_SECRET }}
          SHYAM_YT_REFRESH_TOKEN: ${{ secrets.SHYAM_YT_REFRESH_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SHYAM_META_PAGE_ID: ${{ secrets.SHYAM_META_PAGE_ID }}
          SHYAM_META_PAGE_TOKEN: ${{ secrets.SHYAM_META_PAGE_TOKEN }}
          SHYAM_IG_USER_ID: ${{ secrets.SHYAM_IG_USER_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LINKEDIN_PAGE_TOKEN_EXPIRES: ${{ vars.LINKEDIN_PAGE_TOKEN_EXPIRES }}
          LINKEDIN_MEMBER_TOKEN_EXPIRES: ${{ vars.LINKEDIN_MEMBER_TOKEN_EXPIRES }}
        run: |
          case "$REPORT_DATE" in ''|[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "Bad date"; exit 1 ;; esac
          git pull -q --rebase origin "$GITHUB_REF_NAME" || true # latest snapshot ("sent" guard) if an earlier run pushed
          node _ops/ops/report/report.mjs ${DRY_RUN:+--dry-run} ${FORCE:+--force}

      - name: Save the snapshot
        if: ${{ !inputs.dry_run }}
        run: |
          git add report/snapshot.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Daily report snapshot $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin HEAD && break; sleep 10; done
