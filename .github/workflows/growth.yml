# Growth review. Code, prompts and notes live in the private repo (ops/; annotated copy: ops/docs/workflow-notes/growth.yml).
name: Growth review

on:
  workflow_dispatch:

env:
  SITE_REMOTE: https://x-access-token:${{ secrets.SITE_REPO_TOKEN }}@github.com/sk9836413/EPIVIFE.git

permissions:
  contents: write
  id-token: write

concurrency:
  group: growth
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: YouTube report
        id: report
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          node scripts/social/yt-stats.mjs | tee "$RUNNER_TEMP/report.json"
          echo "file=automation/growth/$(date -u +%F).md" >> "$GITHUB_OUTPUT"

      - name: LinkedIn report
        if: vars.LINKEDIN_STATS == 'on'
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
        run: node scripts/social/linkedin-stats.mjs

      - name: Prompt for Update the strategy (Claude)
        env:
          FILE: ${{steps.report.outputs.file}}
        run: |
          if [ -d .git ]; then grep -qx '.ops-\*' .git/info/exclude || printf '.ops-*\n' >> .git/info/exclude; fi
          node ops/prompts/render.mjs ops/prompts/growth-update-the-strategy-claude.md .ops-prompt.md

      - name: Update the strategy (Claude)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep"
          prompt: Your task for this run is in the file .ops-prompt.md in the repository root. Read it first and follow it exactly.

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/growth automation/STRATEGY.md
          git commit -q -m "Weekly growth review $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull -q --rebase "$SITE_REMOTE" main && git push -q "$SITE_REMOTE" HEAD:main && break; sleep 10; done

      - name: Summary
        if: always()
        run: |
          {
            echo "## Growth review"
            cat "${{ steps.report.outputs.file }}" 2>/dev/null | head -5
            echo
            echo "### Strategy for the coming week"
            cat automation/STRATEGY.md
          } >> "$GITHUB_STEP_SUMMARY"
