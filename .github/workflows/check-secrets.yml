# Prints only whether required secrets are present and look well formed (never their values).
name: Check secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        env:
          CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SITE: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          for n in CLAUDE SITE; do
            v="${!n}"
            t=$(printf '%s' "$v" | tr -d '[:space:]')
            echo "$n: length=${#v} trimmed=${#t} starts_sk_ant_oat=$([[ "$t" == sk-ant-oat* ]] && echo yes || echo no) starts_github_pat=$([[ "$t" == github_pat_* ]] && echo yes || echo no)"
          done
