# Long video. Code, prompts and notes live in the private repo (ops/; annotated copy: ops/docs/workflow-notes/longvideo.yml).
name: Long video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: video = make and upload today's video; facebook = send today's video to the Facebook Page
        type: choice
        options: [video, facebook]
        default: video
      slug:
        description: Make the video for this article instead of the next one (optional)
        type: string
        default: ''
      force:
        description: Make another video even if today's is already uploaded
        type: boolean
        default: false
      upload:
        description: Upload to YouTube (off = render only, nothing is logged)
        type: boolean
        default: true
      publish_now:
        description: Trending topic - public on YouTube at once (not 14:00 UTC) and on the Facebook Page in the same run
        type: boolean
        default: false
      allow_news:
        description: Make the video even if the named article is news (outage, CEO, retirement, incident, launch)
        type: boolean
        default: false

env:
  SITE_REMOTE: https://x-access-token:${{ secrets.SITE_REPO_TOKEN }}@github.com/sk9836413/EPIVIFE.git

permissions:
  contents: write
  id-token: write

concurrency:
  group: longvideo
  cancel-in-progress: false

jobs:
  video:
    if: inputs.mode != 'facebook'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check Claude token
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "ready=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then echo "::notice::CLAUDE_CODE_OAUTH_TOKEN secret is not set; skipping."; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}

      - name: Pick article
        id: pick
        if: steps.gate.outputs.ready == 'true'
        env:
          SLUG_INPUT: ${{ inputs.slug }}
        run: |
          today=$(date -u +%F)
          if [ "${{ inputs.force }}" != "true" ] && grep -q "^- $today | .* | yt: https://" automation/longvideo-log.md 2>/dev/null; then
            echo "::notice::Today's long video is already uploaded."
            echo "slug=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          slug="$SLUG_INPUT"
          if [ -n "$slug" ] && { ! [[ "$slug" =~ ^[a-z0-9-]+$ ]] || ! ls content/posts/"$slug".md* > /dev/null 2>&1; }; then echo "::error::No article $slug"; exit 1; fi
          if [ -n "$slug" ] && [ "$GITHUB_ACTOR" = "github-actions[bot]" ] && grep -q "^- [0-9-]* | $slug | yt: https://" automation/longvideo-log.md 2>/dev/null; then
            echo "::notice::$slug already has a long video; nothing to do."
            echo "slug=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "dir=longvideo/$today" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install ffmpeg, fonts and dependencies
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends ffmpeg fonts-inter fonts-dejavu-core > /dev/null
          npm ci --no-audit --no-fund

      - name: Top articles by traffic
        if: steps.gate.outputs.ready == 'true' && steps.pick.outputs.dir != '' && steps.pick.outputs.slug == ''
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Owner, 27 Nov 2026: videos on what people search; Bing search demand goes ahead of traffic.
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/stats/top-articles.json" -o "$RUNNER_TEMP/top.json" || echo '[]' > "$RUNNER_TEMP/top.json"
          if [ -n "$CF_API_TOKEN" ]; then
            node scripts/stats/top-articles.mjs --days 28 --limit 10 --out "$RUNNER_TEMP/live.json" > /dev/null               && [ "$(node -p "require('$RUNNER_TEMP/live.json').length")" -gt 0 ] && cp "$RUNNER_TEMP/live.json" "$RUNNER_TEMP/top.json"               || echo "::warning::Cloudflare top articles failed; the committed list is used."
          fi
          if [ -n "$BING_WEBMASTER_API_KEY" ]; then
            node scripts/stats/search-demand.mjs --out "$RUNNER_TEMP/demand.json" > /dev/null || echo '[]' > "$RUNNER_TEMP/demand.json"
            node -e "const [d, t] = process.argv.slice(1).map((f) => require(f)); const s = [...new Set([...d.map((x) => x.slug), ...t.map((x) => x.slug || x)])]; require('fs').writeFileSync(process.argv[2], JSON.stringify(s.map((slug) => ({ slug }))))" "$RUNNER_TEMP/demand.json" "$RUNNER_TEMP/top.json"
            echo "Search demand first: $(node -p "require('$RUNNER_TEMP/demand.json').slice(0, 8).map((x) => x.slug + ' ' + x.impressions).join(', ')")"
          fi
          echo "Top articles: $(node -p "require('$RUNNER_TEMP/top.json').slice(0, 10).map((x) => x.slug || x).join(', ')")"

      - name: Choose the article
        id: article
        if: steps.gate.outputs.ready == 'true' && steps.pick.outputs.dir != ''
        run: |
          slug="${{ steps.pick.outputs.slug }}"
          if [ -n "$slug" ] && [ "${{ inputs.allow_news }}" != "true" ]; then
            kind=$(node scripts/social/video-kind.mjs "$slug")
            if [ "$(node -p 'JSON.parse(process.argv[1]).kind' "$kind")" = news ]; then
              echo "::notice::$slug is news ($kind); no long video (owner plan, 16 Nov 2026). Run with allow_news to override."
              echo "slug=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          [ -n "$slug" ] || slug="$(node scripts/social/longvideo.mjs pick --top "$RUNNER_TEMP/top.json")"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          if [ -z "$slug" ]; then echo "::notice::No suitable article left for a long video."; else echo "Long video for $slug"; mkdir -p "${{ steps.pick.outputs.dir }}"; fi

      - name: Cache voice-over model
        if: steps.article.outputs.slug != ''
        uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-onnx-model-files-v1.1

      - name: Install voice-over (edge-tts, Kokoro fallback)
        if: steps.article.outputs.slug != ''
        run: bash scripts/social/setup-tts.sh ~/kokoro

      - name: Prompt for Write the video script (Claude)
        if: steps.article.outputs.slug != ''
        env:
          SLUG: ${{steps.article.outputs.slug}}
          DIR: ${{steps.pick.outputs.dir}}
          PUBLISH_NOW: ${{ inputs.publish_now }}
        run: |
          if [ -d .git ]; then grep -qx '.ops-\*' .git/info/exclude || printf '.ops-*\n' >> .git/info/exclude; fi
          node ops/prompts/render.mjs ops/prompts/longvideo-write-the-video-script-claude.md .ops-prompt.md

      - name: Write the video script (Claude)
        if: steps.article.outputs.slug != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "*"
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(node scripts/social/longvideo.mjs validate:*),Bash(node scripts/social/longvideo.mjs check:*),Bash(mkdir:*),Bash(ls:*)"
          prompt: Your task for this run is in the file .ops-prompt.md in the repository root. Read it first and follow it exactly.

      - name: Check the script
        if: steps.article.outputs.slug != ''
        run: node scripts/social/longvideo.mjs validate "${{ steps.pick.outputs.dir }}"

      - name: Render the video
        id: render
        if: steps.article.outputs.slug != ''
        env:
          LONGVIDEO_JOBS: '3'
        run: |
          node scripts/social/longvideo.mjs render "${{ steps.pick.outputs.dir }}" | tee "$RUNNER_TEMP/render.json"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration -of compact "${{ steps.pick.outputs.dir }}/video.mp4"
          if [ "${{ vars.FB_LONG_VIDEO }}" = "on" ]; then node scripts/social/longvideo.mjs webcopy "${{ steps.pick.outputs.dir }}"; fi

      - name: Upload to YouTube
        id: youtube
        if: steps.render.outcome == 'success' && inputs.upload != false
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DIR: ${{ steps.pick.outputs.dir }}
          PUBLISH_NOW: ${{ inputs.publish_now }}
        run: |
          result="$RUNNER_TEMP/yt-result.json"
          when=(--publish-hour 14)
          [ "$PUBLISH_NOW" = "true" ] && when=(--public-now)
          node scripts/social/youtube.mjs upload-long --dir "$DIR" "${when[@]}" > "$result" || true
          cat "$result"
          status=$(node -p "try { JSON.parse(require('fs').readFileSync('$result','utf8').trim().split('\n').pop()).status } catch { 'error' }")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          case "$status" in
            ok) ;;
            quota) echo "::warning::YouTube quota exceeded; the article is retried on the next run." ;;
            not-configured) echo "::notice::YouTube credentials not set; nothing uploaded." ;;
            *) echo "::error::YouTube upload failed; see the result above." ;;
          esac

      - name: Facebook Page now (publish_now)
        id: fbnow
        if: inputs.publish_now && steps.youtube.outputs.status == 'ok'
        continue-on-error: true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          DIR: ${{ steps.pick.outputs.dir }}
        run: |
          if [ -z "$META_PAGE_TOKEN" ] || [ -z "$META_PAGE_ID" ]; then echo "::notice::META_* secrets not set; the 14:16 UTC facebook run sends it."; exit 0; fi
          result="$RUNNER_TEMP/meta-result.json"
          node scripts/social/meta-post.mjs --long-video "$DIR" > "$result" \
            || echo "::warning::The Facebook Page video upload failed; the 14:16 UTC facebook run retries it."
          cat "$result"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Log and push
        if: steps.youtube.outcome == 'success' && steps.youtube.outputs.status != 'not-configured'
        env:
          FB_RESULT: ${{ steps.fbnow.outputs.result }}
        run: |
          node scripts/social/longvideo.mjs log "${{ steps.pick.outputs.dir }}" "${{ steps.youtube.outputs.result }}" | tee "$RUNNER_TEMP/log-line.txt"
          if [ -n "$FB_RESULT" ] && [ -f "$FB_RESULT" ]; then
            node scripts/social/longvideo.mjs log-facebook "${{ steps.article.outputs.slug }}" "$FB_RESULT" | tee -a "$RUNNER_TEMP/log-line.txt"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/longvideo-log.md
          git commit -q -m "Log long video for ${{ steps.article.outputs.slug }}"
          for i in 1 2 3; do git pull -q --rebase "$SITE_REMOTE" main && git push -q "$SITE_REMOTE" HEAD:main && break; sleep 10; done

      - name: Summary
        if: always() && steps.article.outputs.slug != ''
        env:
          DIR: ${{ steps.pick.outputs.dir }}
        run: |
          {
            echo "## Long video: ${{ steps.article.outputs.slug }}"
            echo
            [ -f "$RUNNER_TEMP/log-line.txt" ] && { echo '```text'; cat "$RUNNER_TEMP/log-line.txt"; echo '```'; }
            [ -f "$RUNNER_TEMP/render.json" ] && { echo '```json'; cat "$RUNNER_TEMP/render.json"; echo '```'; }
            [ -f "$DIR/meta.json" ] && node -e "const m=require('./$DIR/meta.json'); console.log('**' + m.title + '**\n\n' + m.chapters.map((c) => c.at + ' ' + c.title).join('  \n'))"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on an upload error
        if: steps.youtube.outputs.status != '' && steps.youtube.outputs.status != 'ok' && steps.youtube.outputs.status != 'quota' && steps.youtube.outputs.status != 'not-configured'
        run: exit 1

      - name: Upload the video and script
        if: always() && steps.article.outputs.slug != ''
        uses: actions/upload-artifact@v4
        with:
          name: longvideo-${{ steps.article.outputs.slug }}
          path: ${{ steps.pick.outputs.dir }}
          retention-days: 14
          if-no-files-found: ignore

  facebook:
    if: inputs.mode == 'facebook'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check the switch
        id: gate
        env:
          HAS_META: ${{ secrets.META_PAGE_TOKEN != '' && secrets.META_PAGE_ID != '' }}
        run: |
          echo "meta=$HAS_META" >> "$GITHUB_OUTPUT"
          if [ "$HAS_META" != "true" ] && [ "${{ vars.FB_LONG_VIDEO }}" != "on" ]; then
            echo "::notice::No META_* secrets and FB_LONG_VIDEO is not on; the long video is not sent to Facebook."
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.on == 'true'
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}

      - name: Find today's video
        id: find
        if: steps.gate.outputs.on == 'true'
        run: |
          today=$(date -u +%F)
          log=automation/longvideo-log.md
          uploaded=$(awk -F' [|] ' -v d="- $today" '$1 == d && $3 ~ /^yt: https:/ { print $2 }' "$log")
          sent=$(awk -F' [|] ' -v d="- $today" '$1 == d && $3 ~ /^fb-long: (via make|https:)/ { print $2 }' "$log")
          if [ -z "$uploaded" ]; then echo "::notice::No long video uploaded today."; exit 0; fi
          slug=$(printf '%s\n' "$uploaded" | grep -vxF -f <(printf '%s\n' "$sent") | grep . | tail -1 || true)
          if [ -z "$slug" ]; then echo "::notice::Already sent to Facebook."; exit 0; fi
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow longvideo.yml --status success --limit 30 --json databaseId,createdAt \
            --jq "[.[] | select(.createdAt | startswith(\"$today\"))] | .[].databaseId" | while read -r id; do
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq ".artifacts[] | select(.name == \"longvideo-$slug\") | $id" ; done | head -1)
          if [ -z "$run" ]; then echo "::warning::No artifact for $slug from today's run."; exit 0; fi
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n "longvideo-$slug" -D "$RUNNER_TEMP/lv"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "dir=$RUNNER_TEMP/lv" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.find.outputs.slug != ''
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.find.outputs.slug != ''
        run: npm ci --no-audit --no-fund

      - name: Upload to the Facebook Page (Graph API)
        id: meta
        if: steps.find.outputs.slug != ''
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_LONG_VIDEO: ${{ vars.FB_LONG_VIDEO }}
        run: |
          make=false; [ "$FB_LONG_VIDEO" = on ] && make=true
          if [ "${{ steps.gate.outputs.meta }}" = true ]; then
            result="$RUNNER_TEMP/meta-result.json"
            node scripts/social/meta-post.mjs --long-video "${{ steps.find.outputs.dir }}" > "$result" \
              || echo "::warning::The Facebook Page video upload failed; see the result."
            cat "$result"
            echo "result=$result" >> "$GITHUB_OUTPUT"
            grep -q '"authFailed":true' "$result" || make=false
          fi
          echo "make=$make" >> "$GITHUB_OUTPUT"

      - name: Web copy for Make
        if: steps.meta.outputs.make == 'true'
        run: |
          if [ ! -f "${{ steps.find.outputs.dir }}/web.mp4" ]; then
            sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg > /dev/null
            node scripts/social/longvideo.mjs webcopy "${{ steps.find.outputs.dir }}"
          fi

      - name: Host the video (release asset, kept 14 days)
        id: host
        if: steps.meta.outputs.make == 'true'
        env:
          SLUG: ${{ steps.find.outputs.slug }}
          DIR: ${{ steps.find.outputs.dir }}
        run: |
          tag="longvideo-$(date -u +%F)"
          cp "$DIR/web.mp4" "$RUNNER_TEMP/$SLUG.mp4"
          cp "$DIR/thumbnail.jpg" "$RUNNER_TEMP/$SLUG.jpg"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Long video $(date -u +%F)" \
              --notes "EpiFive long video for https://www.epifive.com/blog/$SLUG (hosted for the Facebook Page upload; deleted after 14 days)."
          gh release upload "$tag" "$RUNNER_TEMP/$SLUG.mp4" "$RUNNER_TEMP/$SLUG.jpg" -R "$GITHUB_REPOSITORY" --clobber
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          echo "video=$base/$SLUG.mp4" >> "$GITHUB_OUTPUT"
          echo "thumb=$base/$SLUG.jpg" >> "$GITHUB_OUTPUT"
          cutoff=$(date -u -d '14 days ago' +%F)
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep '^longvideo-' | while read -r old; do
            [ "${old#longvideo-}" \< "$cutoff" ] && gh release delete "$old" -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          done

      - name: Send to the Facebook Page via Make
        id: make
        if: steps.meta.outputs.make == 'true'
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
        run: |
          result="$RUNNER_TEMP/make-result.json"
          node scripts/social/make-send.mjs --long-video "${{ steps.find.outputs.dir }}" \
            --video-url "${{ steps.host.outputs.video }}" --thumbnail-url "${{ steps.host.outputs.thumb }}" > "$result" \
            || echo "::warning::Sending the long video to Make failed; see the result."
          cat "$result"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Log and push
        if: steps.find.outputs.slug != '' && (steps.make.outputs.result != '' || steps.meta.outputs.result != '')
        run: |
          node scripts/social/longvideo.mjs log-facebook "${{ steps.find.outputs.slug }}" "${{ steps.make.outputs.result || steps.meta.outputs.result }}" | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/longvideo-log.md
          git commit -q -m "Log Facebook long video for ${{ steps.find.outputs.slug }}"
          for i in 1 2 3; do git pull -q --rebase "$SITE_REMOTE" main && git push -q "$SITE_REMOTE" HEAD:main && break; sleep 10; done
