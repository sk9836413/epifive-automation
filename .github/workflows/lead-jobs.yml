# Lead jobs. Code, prompts and notes live in the private repo (ops/; annotated copy: ops/docs/workflow-notes/lead-jobs.yml).
name: Lead jobs

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: lead-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Run the site's lead job
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 --retry 2 --retry-all-errors \
            -X POST -H "X-Ingest-Token: $INGEST_TOKEN" -H 'Content-Type: application/json' -d '{}' \
            https://www.epifive.com/api/lead-jobs)
          echo "Lead job: HTTP $status"
          test "$status" = 200
