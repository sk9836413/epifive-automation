# CRM collect. Code, prompts and notes live in the private repo (ops/; annotated copy: ops/docs/workflow-notes/crm-collect.yml).
name: CRM collect

on:
  schedule:
    # Full run: every source, 10 days back. This is the only run that touches the YouTube and Meta APIs,
    # so their daily quota is spent once.
    - cron: '35 1 * * *' # 07:05 IST
    # Light runs: website and Google Search only, 2 days back, so the CRM's Daily performance screen is
    # current when the owner signs in during the day. Both are cheap and have no daily quota worth saving.
    - cron: '30 6 * * *' # 12:00 IST
    - cron: '30 10 * * *' # 16:00 IST
    - cron: '0 14 * * *' # 19:30 IST, just before the daily report email
  workflow_dispatch:
    inputs:
      days:
        description: Days to (re)collect (1-90)
        default: '10'
      only:
        description: 'Only these sources, comma separated (website,gsc,youtube_epifive,youtube_shyam,social,newsletter,devto,calendar). Empty = all.'
        default: ''

permissions:
  contents: read

concurrency:
  group: crm-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code (private repo, ops/)
        uses: actions/checkout@v4
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: _ops
          persist-credentials: false
          sparse-checkout: |
            ops/crm

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect and send to the CRM
        env:
          CRM_URL: ${{ vars.CRM_URL || 'https://epifive-crm.pages.dev' }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          # A light run (any schedule other than the 07:05 full one) refreshes only the cheap sources, 2 days back.
          CRM_DAYS: ${{ inputs.days || (github.event_name == 'schedule' && github.event.schedule != '35 1 * * *') && '2' || '10' }}
          CRM_ONLY: ${{ inputs.only || (github.event_name == 'schedule' && github.event.schedule != '35 1 * * *') && 'website,gsc' || '' }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SHYAM_YT_CLIENT_ID: ${{ secrets.SHYAM_YT_CLIENT_ID }}
          SHYAM_YT_CLIENT_SECRET: ${{ secrets.SHYAM_YT_CLIENT_SECRET }}
          SHYAM_YT_REFRESH_TOKEN: ${{ secrets.SHYAM_YT_REFRESH_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SHYAM_META_PAGE_ID: ${{ secrets.SHYAM_META_PAGE_ID }}
          SHYAM_META_PAGE_TOKEN: ${{ secrets.SHYAM_META_PAGE_TOKEN }}
          SHYAM_IG_USER_ID: ${{ secrets.SHYAM_IG_USER_ID }}
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: node _ops/ops/crm/collect.mjs
