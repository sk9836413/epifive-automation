# LinkedIn via Pipedream: health check, posts nothing. Code and notes live in the private repo (ops/; annotated copy: ops/docs/workflow-notes/linkedin-pipedream.yml).
name: LinkedIn via Pipedream (check)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkedin-pipedream-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the code (private repo)
        uses: actions/checkout@v4
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: _ops
          persist-credentials: false
          sparse-checkout: |
            scripts/social

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Pipedream + CRM choice (no post)
        env:
          PIPEDREAM_CLIENT_ID: ${{ secrets.PIPEDREAM_CLIENT_ID }}
          PIPEDREAM_CLIENT_SECRET: ${{ secrets.PIPEDREAM_CLIENT_SECRET }}
          PIPEDREAM_PROJECT_ID: ${{ secrets.PIPEDREAM_PROJECT_ID }}
          PIPEDREAM_ENVIRONMENT: ${{ secrets.PIPEDREAM_ENVIRONMENT }}
          CRM_URL: ${{ vars.CRM_URL || 'https://epifive-crm.pages.dev' }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          LINKEDIN_VIA: ${{ vars.LINKEDIN_VIA }}
        run: |
          echo "LINKEDIN_VIA=${LINKEDIN_VIA:-make (default)}"
          node _ops/scripts/social/linkedin-pipedream.mjs check
