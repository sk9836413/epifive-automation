# CRM subscribers sync. Code, prompts and notes live in the private repo (ops/; annotated copy: ops/docs/workflow-notes/crm-subscribers.yml).
name: CRM subscribers

on:
  workflow_run:
    workflows: ['CRM collect']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and map only, print counts, send nothing to the CRM
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crm-subscribers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the code (private repo, ops/)
        uses: actions/checkout@v4
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: _ops
          persist-credentials: false
          sparse-checkout: |
            ops/crm
            src/lib

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync Resend contacts to the CRM
        env:
          CRM_URL: ${{ vars.CRM_URL || 'https://epifive-crm.pages.dev' }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          if [ "$DRY_RUN" = true ]; then node _ops/ops/crm/subscribers.mjs --dry-run; else node _ops/ops/crm/subscribers.mjs; fi
