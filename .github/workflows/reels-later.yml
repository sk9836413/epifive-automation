# Reels later. Code, prompts and notes live in the private repo (ops/; annotated copy: ops/docs/workflow-notes/reels-later.yml).
name: Reels later

on:
  workflow_run:
    workflows: [Launch radar]
    types: [completed]
  schedule:
    - cron: '35,50 0 * * *'
    - cron: '5,20,35,50 1,2,3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Download and check the due Reel, post nothing and change nothing
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: reels-later
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out the code (private repo, ops/)
        uses: actions/checkout@v4
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: _ops
          persist-credentials: false
          sparse-checkout: |
            ops/reels

      - name: Anything due?
        id: due
        run: |
          mkdir -p reels
          it=$(node _ops/ops/reels/queue.mjs due --file reels/queue.jsonl)
          echo "$it"
          get() { node -e 'const v = JSON.parse(process.argv[1])[process.argv[2]]; process.stdout.write(v == null ? "" : String(v))' "$it" "$1"; }
          { echo "slug=$(get slug)"; echo "run=$(get run)"; echo "artifact=$(get artifact)"; } >> "$GITHUB_OUTPUT"
          git diff --quiet -- reels/queue.jsonl || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Download the share's media
        id: media
        if: steps.due.outputs.slug != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.due.outputs.artifact }}
          run-id: ${{ steps.due.outputs.run }}
          github-token: ${{ github.token }}
          path: reel

      - uses: actions/checkout@v4
        if: steps.due.outputs.slug != ''
        with:
          repository: sk9836413/EPIVIFE
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site
          sparse-checkout: |
            scripts/social
            package.json
            package-lock.json

      - uses: actions/setup-node@v4
        if: steps.due.outputs.slug != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Post the English Instagram Reel
        id: post
        if: steps.due.outputs.slug != ''
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          REELS_HOST_REPO: ${{ github.repository }}
          REELS_HOST_TOKEN: ${{ github.token }}
          COMMENT_FUNNEL_IG: ${{ vars.COMMENT_FUNNEL_IG }}
          SLUG: ${{ steps.due.outputs.slug }}
          DRY: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          result="$RUNNER_TEMP/ig-en.json"
          if [ "${{ steps.media.outcome }}" != success ] || [ ! -s reel/reel.mp4 ] || [ ! -s reel/instagram.txt ]; then
            echo '{"status":"error","error":"share artifact or its reel.mp4/instagram.txt is missing"}' > "$result"
          else
            (cd site && npm ci --no-audit --no-fund --ignore-scripts > /dev/null)
            set -- --slug "$SLUG" --video ../reel/reel.mp4 --ig ../reel/instagram.txt --only ig
            [ "$DRY" = true ] && set -- "$@" --dry-run
            (cd site && node scripts/social/meta-post.mjs "$@") > "$result" || echo "::warning::The English Instagram Reel failed; see the result."
          fi
          cat "$result" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Record and push
        if: always() && !inputs.dry_run && (steps.due.outputs.changed == 'true' || steps.due.outputs.slug != '')
        env:
          SLUG: ${{ steps.due.outputs.slug }}
          RESULT: ${{ steps.post.outputs.result }}
        run: |
          if [ -n "$SLUG" ]; then
            if [ -z "$RESULT" ] || [ ! -s "$RESULT" ]; then RESULT="$RUNNER_TEMP/none.json"; echo '{"status":"error","error":"no result"}' > "$RESULT"; fi
            node _ops/ops/reels/queue.mjs done --file reels/queue.jsonl --slug "$SLUG" --result "$RESULT" --log reels/log.md | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels
          git diff --cached --quiet && exit 0
          git commit -qm "Reels later: ${SLUG:-queue update} $(date -u '+%F %H:%M') UTC"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
